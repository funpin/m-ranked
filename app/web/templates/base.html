  <script>
    (() => {
      let theme = 'dark';
      try {
        const savedTheme = localStorage.getItem('m-ranked-theme');
        if (savedTheme === 'light' || savedTheme === 'dark') theme = savedTheme;
      } catch (_) {}
      document.documentElement.dataset.theme = theme;
    })();
  </script>

  <script>
    window.setChartTheme = theme => {
      if (!window.Chart) return;
      const light = theme === 'light';
      Chart.defaults.color = light ? '#667085' : '#98a6ba';
      Chart.defaults.borderColor = light ? 'rgba(102,112,133,.18)' : 'rgba(152,166,186,.18)';
      Chart.defaults.plugins.tooltip.backgroundColor = light ? '#161a22' : '#05080d';
      Chart.defaults.plugins.tooltip.titleColor = '#f4f7fb';
      Chart.defaults.plugins.tooltip.bodyColor = light ? '#e5eaf2' : '#d8e1ed';
      Chart.defaults.plugins.tooltip.borderColor = light ? '#344054' : '#33445b';
      Chart.defaults.plugins.tooltip.borderWidth = 1;
      Object.values(Chart.instances || {}).forEach(chart => chart.update('none'));
    };
    window.setChartTheme(document.documentElement.dataset.theme);
  </script>

<body>
<nav aria-label="Основная навигация">
  <a class="brand" href="{{ nav_urls.overview }}"><img src="/static/logo.png" alt="Логотип m-ranked"><strong><span>m</span>-ranked</strong></a>
  <div class="nav-links" id="mainNav">
    <a href="{{ nav_urls.overview }}">Обзор</a><a href="{{ nav_urls.rating }}">Рейтинг</a><a href="{{ nav_urls.compare }}">Сравнение</a><a href="{{ nav_urls.export }}">Экспорт CSV</a><a href="{{ nav_urls.manage }}">Управление</a>
  </div>
  <div class="nav-actions">
    <button class="theme-toggle" id="themeToggle" type="button"><span class="theme-toggle-icon" aria-hidden="true">☾</span><span class="theme-toggle-label">Тёмная</span></button>
    <button class="menu-toggle" id="menuToggle" type="button" aria-controls="mainNav" aria-expanded="false"><span class="menu-toggle-bars" aria-hidden="true"><i></i><i></i><i></i></span><span class="visually-hidden">Открыть меню</span></button>
  </div>
</nav>
<main>{% block content %}{% endblock %}</main>
<div id="floatingTooltip" class="floating-tooltip" role="tooltip" hidden></div>
<script>
(() => {
  const root = document.documentElement;
  const themeToggle = document.getElementById('themeToggle');
  const themeIcon = themeToggle.querySelector('.theme-toggle-icon');
  const themeLabel = themeToggle.querySelector('.theme-toggle-label');
  const themeMeta = document.querySelector('meta[name="theme-color"]');
  const menuToggle = document.getElementById('menuToggle');
  const menu = document.getElementById('mainNav');
  const mobileMenu = window.matchMedia('(max-width: 780px)');

  function renderTheme(theme) {
    const dark = theme === 'dark';
    root.dataset.theme = theme;
    themeIcon.textContent = dark ? '☾' : '☀';
    themeLabel.textContent = dark ? 'Тёмная' : 'Светлая';
    themeToggle.setAttribute('aria-label', dark ? 'Включить светлую тему' : 'Включить тёмную тему');
    themeToggle.setAttribute('title', dark ? 'Включить светлую тему' : 'Включить тёмную тему');
    themeMeta.content = dark ? '#080c12' : '#f4f7fb';
    window.setChartTheme(theme);
  }

  function closeMenu() {
    menu.classList.remove('is-open');
    menuToggle.setAttribute('aria-expanded', 'false');
    menuToggle.querySelector('.visually-hidden').textContent = 'Открыть меню';
  }

  renderTheme(root.dataset.theme || 'dark');
  themeToggle.addEventListener('click', () => {
    const theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('m-ranked-theme', theme); } catch (_) {}
    renderTheme(theme);
  });
  menuToggle.addEventListener('click', () => {
    const open = !menu.classList.contains('is-open');
    menu.classList.toggle('is-open', open);
    menuToggle.setAttribute('aria-expanded', String(open));
    menuToggle.querySelector('.visually-hidden').textContent = open ? 'Закрыть меню' : 'Открыть меню';
  });
  menu.addEventListener('click', event => { if (mobileMenu.matches && event.target.closest('a')) closeMenu(); });
  document.addEventListener('keydown', event => { if (event.key === 'Escape') closeMenu(); });
  mobileMenu.addEventListener?.('change', event => { if (!event.matches) closeMenu(); });
})();
</script>
<script>
(() => {
  const coarsePointer = window.matchMedia('(hover: none), (pointer: coarse)');
  document.addEventListener('click', event => {
    if (!coarsePointer.matches) return;
    const tooltip = event.target.closest('.has-tooltip[data-tooltip]');
    const opened = document.querySelector('.has-tooltip.tooltip-open');
    if (!tooltip) { if (opened) opened.classList.remove('tooltip-open'); return; }
    if (tooltip.classList.contains('tooltip-open')) {
      tooltip.classList.remove('tooltip-open');
      tooltip.setAttribute('aria-expanded', 'false');
      return;
    }
    event.preventDefault();
    event.stopPropagation();
    if (opened) { opened.classList.remove('tooltip-open'); opened.setAttribute('aria-expanded', 'false'); }
    tooltip.classList.add('tooltip-open');
    tooltip.setAttribute('aria-expanded', 'true');
    tooltip.focus({preventScroll: true});
  }, true);
})();
</script>
<script>
(() => {
  const bubble = document.getElementById('floatingTooltip');
  const coarsePointer = window.matchMedia('(hover: none), (pointer: coarse)');
  let active;
  function hide() { bubble.hidden = true; if (active) active.classList.remove('tooltip-open'); active = null; }
  function show(target) {
    const text = target.dataset.floatingTooltip; if (!text) return;
    active = target; bubble.textContent = text; bubble.hidden = false;
    bubble.classList.toggle('mobile', coarsePointer.matches);
    if (coarsePointer.matches) return;
    const rect = target.getBoundingClientRect();
    const left = Math.max(12, Math.min(rect.left, innerWidth - bubble.offsetWidth - 12));
    const above = rect.top - bubble.offsetHeight - 8;
    bubble.style.left = `${left}px`; bubble.style.top = `${above >= 12 ? above : rect.bottom + 8}px`;
  }
  document.addEventListener('mouseover', event => { const target = event.target.closest('[data-floating-tooltip]'); if (target && !coarsePointer.matches) show(target); });
  document.addEventListener('mouseout', event => { if (active && !active.contains(event.relatedTarget)) hide(); });
  document.addEventListener('focusin', event => { const target = event.target.closest('[data-floating-tooltip]'); if (target) show(target); });
  document.addEventListener('focusout', event => { if (active && !active.contains(event.relatedTarget)) hide(); });
  document.addEventListener('click', event => {
    if (!coarsePointer.matches) return;
    const target = event.target.closest('[data-floating-tooltip]');
    if (!target) { hide(); return; }
    if (active === target) { hide(); return; }
    event.preventDefault(); event.stopPropagation(); hide(); target.classList.add('tooltip-open'); show(target);
  }, true);
  addEventListener('scroll', hide, {passive: true}); addEventListener('resize', hide);
})();
</script>
