global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 1m
    timeout server 1m

frontend public_tls_mux
    bind 0.0.0.0:443
    mode tcp
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    acl m_ranked_https req.ssl_sni -i m.funpin.ru m.funpin.su trm.funpin.ru
    use_backend m_ranked_nginx_tls if m_ranked_https
    default_backend xray_reality

backend m_ranked_nginx_tls
    mode tcp
    server nginx_tls 127.0.0.1:8443 check

backend xray_reality
    mode tcp
    server xray_reality 127.0.0.1:4443 check
