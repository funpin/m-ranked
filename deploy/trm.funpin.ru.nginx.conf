server {
    listen 80;
    listen [::]:80;
    server_name m.funpin.ru m.funpin.su;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
}

server {
    listen 80;
    listen [::]:80;
    server_name trm.funpin.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://m.funpin.ru$request_uri;
    }
}

server {
    # HAProxy forwards HTTPS for both m-ranked domains here by SNI.
    listen 127.0.0.1:8443 ssl;
    server_name m.funpin.ru m.funpin.su;

    ssl_certificate /etc/letsencrypt/live/m.funpin.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/m.funpin.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MRANKED_TLS:10m;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
}

server {
    # Keep old bookmarks working, but make m.funpin.ru canonical.
    listen 127.0.0.1:8443 ssl;
    server_name trm.funpin.ru;

    ssl_certificate /etc/letsencrypt/live/trm.funpin.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trm.funpin.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://m.funpin.ru$request_uri;
}
