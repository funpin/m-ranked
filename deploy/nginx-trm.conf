# Legacy HTTP-only configuration is intentionally reduced to redirects.
# Production HTTPS is configured in trm.funpin.ru.nginx.conf.
server {
    listen 80;
    listen [::]:80;
    server_name m.funpin.ru m.funpin.su;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name trm.funpin.ru;
    return 301 https://m.funpin.ru$request_uri;
}
