        - shortName
        - primaryCohortSize
        - engagementCohortSize
        - points
        - engagementPoints
      properties:
        selectionId:
          type: string
          format: uuid
          description: Institution UUID for institution selection, platform-account UUID for channel selection.
        selectionType:
          type: string
          enum: [channels, institutions]
