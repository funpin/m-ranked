      - ageHours
      - views
      - reactions
      - comments
      - shares
      - deltaViews
      - deltaReactions
      - deltaComments
      - deltaShares
      - reactionsBreakdown
      - deltaReactionsBreakdown
      - reactionsBreakdownEntries
      - deltaReactionsBreakdownEntries
      - synthetic
      - intervalUncertain
      - quality
      - rawEvidence
      properties:
        snapshotId:
          type: string
        observedAt:
          type: string
          format: date-time
        ageHours:
          type: number
        views:
          $ref: '#/components/schemas/CounterMetric'
        reactions:
          $ref: '#/components/schemas/CounterMetric'
        comments:
          $ref: '#/components/schemas/CounterMetric'
        shares:
          $ref: '#/components/schemas/CounterMetric'
        deltaViews:
          type:
          - integer
          - 'null'
          format: int64
        deltaReactions:
          type:
          - integer
          - 'null'
          format: int64
        deltaComments:
          type:
          - integer
          - 'null'
          format: int64
        deltaShares:
          type:
          - integer
          - 'null'
          format: int64
        reactionsBreakdown:
          type: object
          additionalProperties:
            type: integer
            format: int64
        deltaReactionsBreakdown:
          type:
          - object
          - 'null'
          additionalProperties:
            type: integer
            format: int64
          description: Exact retained Telegram per-reaction deltas, or full-history server deltas for native observations. Null means unavailable; an empty object means no per-reaction changes.
        reactionsBreakdownEntries:
          type: array
          items:
            $ref: '#/components/schemas/ReactionBreakdownEntry'
          description: Current reaction counts in retained legacy JSON key order when it matches canonical counts; otherwise deterministic canonical order. Reaction labels retain exact variation selectors and custom identifiers.
        deltaReactionsBreakdownEntries:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ReactionBreakdownEntry'
          description: Same signed values as deltaReactionsBreakdown, in retained source order. Native differences use full published history and exact reaction keys, independent of the current page boundary.
        synthetic:
          type: boolean
        intervalUncertain:
          type: boolean
        quality:
          type: string
        rawEvidence:
          type: object
          additionalProperties: true
          description: Sanitized immutable observation lineage; this does not expose provider secrets or unrestricted
            raw payloads.
    ReactionBreakdownEntry:
      type: object
      additionalProperties: false
      required:
      - reaction
      - count
      properties:
        reaction:
          type: string
        count:
