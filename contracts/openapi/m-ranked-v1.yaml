          type: integer
          format: int64
          description: Legacy institution ID that owns this series.
        canonicalName:
          type: string
        shortName:
          type: [string, 'null']
        primaryCohortSize:
          type: integer
          format: int32
          minimum: 0
          description: Publications with a valid requested metric at both primary boundary hours.
        engagementCohortSize:
          type: integer
          format: int32
          minimum: 0
          description: Publications with a valid per-publication ratio at both engagement boundary hours.
        points:
          type: array
          maxItems: 337
          description: Requested metric over its metric-specific fixed cohort.
          items:
            $ref: '#/components/schemas/ComparisonPoint'
        engagementPoints:
          type: array
          maxItems: 337
          description: >-
            Median per-publication percentages. A null value means no valid earlier ratio was
            known for that hour; the API does not interpolate or carry future values backward.
          items:
            $ref: '#/components/schemas/ComparisonPoint'
