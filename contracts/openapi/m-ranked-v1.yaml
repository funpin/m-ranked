        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/publications/{publicationId}/anomaly-signals:
    post:
      tags: [Admin]
      operationId: createManualAnomalySignal
      summary: Create an append-only manual anomaly signal
      description: ADMIN only. The manual signal has no fabricated detector score.
      security:
        - basicAuth: []
      parameters:
        - name: publicationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: X-Correlation-Id
          in: header
          required: false
          schema: { type: string, format: uuid }
        - name: X-XSRF-TOKEN
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateManualAnomalySignalRequest'
      responses:
        '200':
          description: Created or idempotently replayed command result.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnomalyCommandResult'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/OptimisticLockConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/anomaly-signals/{findingId}/reviews:
    post:
      tags: [Admin]
      operationId: appendAnomalyReview
      summary: Append an effective review decision to an anomaly signal
      description: ADMIN only. Private comments are never exposed by the public API.
      security:
        - basicAuth: []
      parameters:
        - name: findingId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: X-Correlation-Id
          in: header
          required: false
          schema: { type: string, format: uuid }
        - name: X-XSRF-TOKEN
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppendAnomalyReviewRequest'
      responses:
        '200':
          description: Appended or idempotently replayed command result.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnomalyCommandResult'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/OptimisticLockConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/exports:
    post:
      operationId: createExportJob
      summary: Create an authenticated bounded background CSV export
      description: EDITOR or ADMIN, owner scoped. Uses one fixed revision, 2 workers, 4 artifact slots, 15 minute
        TTL, 2 million rows, 512 MiB and 300 seconds. Artifacts live on disk and are removed on cancellation or expiry.
        A revision changed before worker startup fails closed.
      security:
      - basicAuth: []
      parameters:
      - name: X-XSRF-TOKEN
        in: header
        required: true
        schema:
          type: string
        description: Token from the authenticated admin CSRF endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - platform
              properties:
                platform:
                  $ref: '#/components/schemas/PlatformValue'
      responses:
        '202':
          description: Owner-scoped export job state and bounded progress.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: Owner rate quota or global worker/artifact capacity reached.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/admin/exports/{id}:
    get:
      operationId: getExportJob
      summary: Read the current user's export progress
      security:
      - basicAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Owner-scoped export job state and bounded progress.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: cancelExportJob
      summary: Cancel the current user's export and delete its artifact
      security:
      - basicAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-XSRF-TOKEN
        in: header
        required: true
        schema:
          type: string
        description: Token from the authenticated admin CSRF endpoint.
      responses:
        '200':
          description: Owner-scoped export job state and bounded progress.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/exports/{id}/download:
    get:
      operationId: downloadExportJob
      summary: Stream a completed unexpired artifact owned by the current user
      security:
      - basicAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Bounded UTF-8 modern CSV, disk streamed with fixed revision; legacy CSV remains a separate
            contract.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Content-Disposition:
              schema:
                type: string
            X-Dataset-Revision:
              schema:
                type: integer
                format: int64
          content:
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The job has no completed unexpired artifact.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: >-
        Transitional stateless admin authentication. Store only bcrypt hashes in runtime
        configuration and expose this surface exclusively behind TLS. OIDC remains a later slice.
  parameters:
    Platform:
      name: platform
      in: query
      schema:
        type: string
        enum: [all, telegram, vk, max, rutube]
        default: all
    Period:
      name: period
      in: query
      schema:
        type: string
        enum: [3h, 1d, 7d, 30d]
        default: 1d
    LegacyId:
      name: legacyId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    EntityId:
      name: legacyId
      in: path
      required: true
      description: Canonical UUID for every platform. Positive legacy integers remain supported with legacyType; legacyType is ignored for UUIDs.
      schema:
        oneOf:
        - type: string
          format: uuid
        - type: integer
          format: int64
          minimum: 1
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: Current or weak ETag; wildcard matching is supported.
      schema:
        type: string
  headers:
    ETag:
      description: >-
        Validator derived from the same API namespace, authoritative PostgreSQL dataset revision,
        and normalized-query fingerprint used by the public response cache.
      schema:
        type: string
    PublicCache:
      description: Public response cache policy.
      schema:
        type: string
        const: max-age=30, must-revalidate, public
    NoStore:
      description: Response must not be stored.
      schema:
        type: string
        const: no-store
  responses:
    InvalidRequest:
      description: A query, path parameter, or cursor is invalid.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No alias-backed resource exists at this dataset revision.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: An unexpected failure occurred before the response was committed.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Authentication is missing or invalid.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        WWW-Authenticate:
          description: Basic authentication challenge for the transitional admin surface.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The authenticated role cannot perform the requested operation or CSRF failed.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    OptimisticLockConflict:
      description: The supplied expected row version is stale.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AdminUnavailable:
      description: The dedicated administrative database connection is disabled or unavailable.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    AdminManagedAccount:
      type: object
      additionalProperties: false
      required:
      - id
      - legacyId
      - channelId
      - institutionId
      - platform
      - externalKey
      - username
      - title
      - url
      - accessMode
      - enabled
      - rowVersion
      - nativeId
      - subscribers
      - legacyAccessMode
      - lastErrorCode
      properties:
        id:
          type: string
          format: uuid
        legacyId:
          type: integer
          format: int64
          minimum: 0
        channelId:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        institutionId:
          type: string
          format: uuid
        platform:
          type: string
          enum:
          - telegram
          - vk
          - max
          - rutube
        externalKey:
          type: string
        username:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        url:
          type:
          - string
          - 'null'
        accessMode:
          type: string
        legacyAccessMode:
          description: Safe original legacy display mode when compatible with the current collector protocol, or its native equivalent.
          type:
          - string
          - 'null'
        lastErrorCode:
          description: Fixed non-secret error classification; original provider error text is never returned.
          type:
          - string
          - 'null'
        enabled:
          type: boolean
        rowVersion:
          type: integer
          format: int64
          minimum: 0
        nativeId:
          type:
          - string
          - 'null'
        subscribers:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
    AdminOfficialRating:
      type: object
      additionalProperties: false
      required:
      - rank
      - score
      properties:
        rank:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        score:
          type:
          - number
          - 'null'
    AdminManagedInstitution:
      type: object
      additionalProperties: false
      required:
      - id
      - legacyId
      - name
      - shortName
      - rowVersion
      - accounts
      - nextAccountAfter
      - officialRatings
      properties:
        id:
          type: string
          format: uuid
        legacyId:
          type: integer
          format: int64
          minimum: 0
        name:
          type: string
        shortName:
          type:
          - string
          - 'null'
        rowVersion:
          type: integer
          format: int64
          minimum: 0
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/AdminManagedAccount'
        nextAccountAfter:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        officialRatings:
          type: object
          additionalProperties: false
          required:
          - all
          - telegram
          - vk
          - max
          - rutube
          properties:
            all:
              $ref: '#/components/schemas/AdminOfficialRating'
            telegram:
              $ref: '#/components/schemas/AdminOfficialRating'
            vk:
              $ref: '#/components/schemas/AdminOfficialRating'
            max:
              $ref: '#/components/schemas/AdminOfficialRating'
            rutube:
              $ref: '#/components/schemas/AdminOfficialRating'
    AdminCatalogPage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextAfter
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminManagedInstitution'
        nextAfter:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
    AdminCatalogAccountPage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextAfter
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminManagedAccount'
        nextAfter:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
    AdminCatalogCommandResult:
      type: object
      additionalProperties: false
      required:
      - outcome
      - targetId
      - legacyId
      - datasetRevision
      - rowVersion
      - correlationId
      properties:
        outcome:
          type: string
          const: succeeded
        targetId:
          type: string
          format: uuid
        legacyId:
          type: integer
          format: int64
          minimum: 0
        datasetRevision:
          type: integer
          format: int64
          minimum: 0
        rowVersion:
          type: integer
          format: int64
          minimum: 0
        correlationId:
          type: string
          format: uuid
    AdminCatalogCreateInstitution:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 1000
        shortName:
          type:
          - string
          - 'null'
          maxLength: 1000
    AdminCatalogUpdateInstitution:
      type: object
      additionalProperties: false
      required:
      - name
      - shortName
      - expectedRowVersion
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 1000
        shortName:
          type: string
          minLength: 1
          maxLength: 1000
        expectedRowVersion:
          type: integer
          format: int64
          minimum: 0
    AdminCatalogAccountRequest:
      type: object
      description: Omitting expectedRowVersion creates a new active enrollment and returns 409 if one already exists. Updating requires the observed rowVersion; a missing or deleted enrollment with a supplied version also returns 409. Catalogue display links accept HTTP and HTTPS and are never fetched by this command.
      additionalProperties: false
      required:
      - institutionId
      - platform
      - reference
      properties:
        institutionId:
          type: string
          format: uuid
        expectedRowVersion:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        platform:
          type: string
          enum:
          - telegram
          - vk
          - max
          - rutube
        reference:
          type: string
          minLength: 1
          maxLength: 2048
        title:
          type:
          - string
          - 'null'
          maxLength: 1000
        url:
          type:
          - string
          - 'null'
          maxLength: 2048
    AdminCatalogAccountCommand:
      type: object
      additionalProperties: false
      required:
      - expectedRowVersion
      properties:
        expectedRowVersion:
          type: integer
          format: int64
          minimum: 0
        nativeId:
          type:
          - string
          - 'null'
          maxLength: 200
    AdminCatalogLegacyCommand:
      type: object
      additionalProperties: false
      required:
      - path
      - fields
      properties:
        path:
          type: string
          maxLength: 200
          pattern: ^/manage/
        fields:
          type: object
          maxProperties: 20
          additionalProperties:
            type: string
            maxLength: 131072
    AdminCatalogLegacyResult:
      type: object
      additionalProperties: false
      required:
      - location
      properties:
        location:
          type: string
          pattern: ^/manage(?:\?.*)?$
    AdminCatalogSession:
      type: object
      additionalProperties: false
      required:
      - headerName
      - token
      - canEdit
      - canDelete
      properties:
        headerName:
          type: string
          const: X-XSRF-TOKEN
        token:
          type: string
        canEdit:
          type: boolean
        canDelete:
          type: boolean
    AdminCatalogStatus:
      type: object
      additionalProperties: false
      required:
      - channelCount
      - platformCount
      - institutionCount
      - mRating
      - integrations
      - storage
      properties:
        channelCount:
          type: integer
          format: int64
          minimum: 0
        platformCount:
          type: integer
          format: int64
          minimum: 0
        institutionCount:
          type: integer
          format: int64
          minimum: 0
        mRating:
          type: object
          additionalProperties: false
          required:
          - period
          - updatedAt
          - error
          properties:
            period:
              type:
              - string
              - 'null'
            updatedAt:
              type:
              - string
              - 'null'
            error:
              type:
              - string
              - 'null'
        integrations:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - platform
            - status
            - detail
            properties:
              platform:
                type: string
                enum:
                - telegram
                - vk
                - max
                - rutube
              status:
                type: string
                enum:
                - configured
                - missing
                - unknown
              detail:
                type: string
        storage:
          type: object
          additionalProperties: false
          required:
          - diskTotalBytes
          - diskFreeBytes
          - projectBytes
          - databaseBytes
          properties:
            diskTotalBytes:
              type:
              - integer
              - 'null'
              format: int64
              minimum: 0
            diskFreeBytes:
              type:
              - integer
              - 'null'
              format: int64
              minimum: 0
            projectBytes:
              type:
              - integer
              - 'null'
              format: int64
              minimum: 0
            databaseBytes:
              type:
              - integer
              - 'null'
              format: int64
              minimum: 0
    HealthUnavailable:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: DOWN
    LegacyHealthCounter:
      description: Imported legacy counters preserve their numeric or string representation; absent values remain null.
      type: [number, string, 'null']
    LegacyHealthPollCycle:
      type: object
      additionalProperties: false
      required: [completed_at, duration_seconds, error_count]
      properties:
        started_at:
          type: [string, 'null']
        completed_at:
          type: [string, 'null']
        duration_seconds:
          $ref: '#/components/schemas/LegacyHealthCounter'
        error_count:
          $ref: '#/components/schemas/LegacyHealthCounter'
        channel_count:
          $ref: '#/components/schemas/LegacyHealthCounter'
        account_count:
          $ref: '#/components/schemas/LegacyHealthCounter'
    LegacyHealth:
      type: object
      additionalProperties: false
      required: [status, data_source, source_connected, collector_fresh, telegram_connected, channels, last_poll, next_poll, poll_cycle, integrations]
      properties:
        status:
          type: string
          const: ok
        data_source:
          type: string
          enum: [public_web, telegram_web, mtproto]
        source_connected:
          type: boolean
        collector_fresh:
          type: boolean
        telegram_connected:
          type: boolean
        channels:
          type: integer
          minimum: 0
        last_poll:
          type: [string, 'null']
        next_poll:
          type: [string, 'null']
        poll_cycle:
          $ref: '#/components/schemas/LegacyHealthPollCycle'
        integrations:
          type: object
          additionalProperties: false
          required: [telegram, vk, max, rutube]
          properties:
            telegram:
              type: object
              additionalProperties: false
              required: [configured, mode, comments_last_success_at, comments_last_error]
              properties:
                configured: {type: boolean}
                mode: {type: string, enum: [public_web, telegram_web, mtproto]}
                comments_last_success_at: {type: [string, 'null']}
                comments_last_error:
                  type: [string, 'null']
                  enum: [upstream_error, null]
            vk:
              type: object
              additionalProperties: false
              required: [configured, poll_cycle]
              properties:
                configured: {type: boolean}
                poll_cycle: {$ref: '#/components/schemas/LegacyHealthPollCycle'}
            max:
              type: object
              additionalProperties: false
              required: [configured, mode, phone_configured, session_exists, poll_cycle]
              properties:
                configured: {type: boolean}
                mode: {type: string, const: user_session}
                phone_configured: {type: boolean}
                session_exists: {type: boolean}
                poll_cycle: {$ref: '#/components/schemas/LegacyHealthPollCycle'}
            rutube:
              type: object
              additionalProperties: false
              required: [configured, mode, poll_cycle]
              properties:
                configured: {type: boolean}
                mode: {type: string, const: official_public_api}
                poll_cycle: {$ref: '#/components/schemas/LegacyHealthPollCycle'}
    CollectorFreshness:
      type: object
      additionalProperties: false
      required: [status, asOf, datasetRevision, revisionLag, freshnessThresholdSeconds, platforms]
      properties:
        status: {type: string, enum: [UP, DOWN]}
        asOf: {type: string, format: date-time}
        datasetRevision: {type: integer, format: int64, minimum: 0}
        revisionLag: {type: integer, format: int64, minimum: 0}
        freshnessThresholdSeconds: {type: integer, minimum: 600}
        platforms:
          type: object
          additionalProperties: false
          required: [telegram, vk, max, rutube]
          properties:
            telegram: {$ref: '#/components/schemas/PlatformFreshness'}
            vk: {$ref: '#/components/schemas/PlatformFreshness'}
            max: {$ref: '#/components/schemas/PlatformFreshness'}
            rutube: {$ref: '#/components/schemas/PlatformFreshness'}
    PlatformFreshness:
      type: object
      additionalProperties: false
      required: [configured, fresh, completedAt]
      properties:
        configured: {type: boolean}
        fresh: {type: boolean}
        completedAt: {type: [string, 'null']}
    Liveness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: UP
    Readiness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [UP, DOWN]
        datasetRevision:
          type: integer
          format: int64
          minimum: 0
    DatasetRevision:
      type: object
      additionalProperties: false
      required:
      - datasetRevision
      - asOf
      - representationVersion
      properties:
        datasetRevision:
          type: integer
          format: int64
        asOf:
          type: string
          format: date-time
        representationVersion:
