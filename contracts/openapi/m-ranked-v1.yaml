openapi: 3.1.0
info:
  title: M-Ranked API
  version: 1.0.0
  description: >-
    Public reads are backed by revision-pinned projections and legacy identifier aliases.
    Administrative status and account commands are authenticated, role-scoped and never cached.
tags:
  - name: Operations
  - name: Query
  - name: Media
  - name: Export
  - name: Admin
paths:
  /api/v1/health/live:
    get:
      tags: [Operations]
      operationId: getLiveness
      summary: Process liveness
      security: []
      responses:
        '200':
          description: The process can serve HTTP requests.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
  /api/v1/health/ready:
    get:
      tags: [Operations]
      operationId: getReadiness
      summary: Database and dataset readiness
      security: []
      responses:
        '200':
          description: Database access and the current dataset revision are available.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: A required dependency is unavailable.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
  /api/v1/emoji/{emojiId}:
    get:
      tags: [Media]
      operationId: getCustomEmoji
      summary: Resolve a Telegram custom emoji to a browser-renderable image
      description: >-
        Compatibility media endpoint for the legacy `/emoji/{emoji_id}` route. Successful images
        are cached in-process for six hours. Metadata, selected assets, and every redirect are
        restricted to HTTPS Telegram hosts; image bodies larger than 2,000,000 bytes are rejected.
      security: []
      parameters:
        - name: emojiId
          in: path
          required: true
          description: Legacy Telegram custom-emoji document identifier.
          schema:
            type: string
            pattern: '^[0-9]{1,32}$'
      responses:
        '200':
          description: Exact upstream image bytes in a browser-renderable format.
          headers:
            Cache-Control:
              description: Six-hour public browser cache matching the legacy route.
              schema:
                type: string
                const: 'public, max-age=21600'
          content:
            image/webp:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/overview:
    get:
      tags: [Query]
      operationId: getOverview
      summary: Page through institution metrics
      description: >-
        Uses an opaque keyset cursor over a globally sorted legacy-card projection. Missing sort
        values stay last in both directions. Results and validators are pinned to the dataset
        revision selected at the beginning of the request.
      security: []
      parameters:
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/Period'
        - name: q
          in: query
          description: Case-insensitive institution-name fragment.
          schema:
            type: string
            maxLength: 200
            default: ''
        - name: sort
          in: query
          description: >-
            Legacy sort key. `coverage` and `accounts` apply only to `all`; `posts` and
            `subscribers` apply only to a concrete platform. Unsupported combinations normalize
            to `m_rating` for `all` and `median_reactions` otherwise.
          schema:
            type: string
            enum: [name, median_reactions, m_rating, reactions, views, posts, subscribers, coverage, accounts]
            default: median_reactions
        - name: direction
          in: query
          description: Defaults to ascending for `name`, descending otherwise.
          schema:
            type: string
            enum: [asc, desc]
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          description: Opaque cursor returned as `nextCursor` by a previous response.
          schema:
            type: string
            maxLength: 512
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: A revision-pinned page of metrics.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PublicCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewPage'
        '304':
          description: The supplied validator matches this representation.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PublicCache'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/institutions/{legacyId}:
    get:
      tags: [Query]
      operationId: getInstitution
      summary: Resolve a legacy institution id and return its metrics
      security: []
      parameters:
        - $ref: '#/components/parameters/LegacyId'
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/Period'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Institution and revision-pinned metrics.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PublicCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Institution'
        '304':
          description: The supplied validator matches this representation.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PublicCache'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/publications/{legacyId}:
    get:
      tags: [Query]
      operationId: getPublication
      summary: Resolve a legacy publication id and return latest independent counters
      security: []
      parameters:
        - $ref: '#/components/parameters/LegacyId'
        - name: legacyType
          in: query
          description: Namespace of the legacy identifier.
          schema:
            type: string
            enum: [posts, platform_posts]
            default: posts
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Publication identity and its latest revision-pinned counters.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PublicCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publication'
        '304':
          description: The supplied validator matches this representation.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PublicCache'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/rating:
    get:
      tags: [Query]
      operationId: getRating
      summary: Read the legacy activity rating for one platform and period
      description: >-
        Returns activity entities plus the top 50 publications from one dataset revision. Telegram
        ranks enabled channels and keeps channels without publications; VK and RUTUBE aggregate
        institutions that have publications. Metrics come from each publication's coherent latest
        non-synthetic cumulative snapshot. Entities are intentionally bounded by `entityLimit`;
        `entitiesTruncated` reports when this target API cannot return the legacy page's unbounded
        tail. Unknown period values accepted by the browser route fall back to `1d`; omission is
        `30d`. This endpoint is separate from official rating observations and derived rating runs.
      security: []
      parameters:
        - name: platform
          in: query
          schema:
            type: string
            enum: [telegram, vk, rutube]
            default: telegram
        - name: period
          in: query
          schema:
            $ref: '#/components/schemas/PeriodValue'
          description: Omission selects 30d; the server retains the legacy invalid-value fallback to 1d.
        - name: channel_sort
          in: query
          schema:
            type: string
            enum: [average, total, engagement, views, subscribers]
            default: engagement
        - name: channel_direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: post_sort
          in: query
          schema:
            type: string
            enum: [reactions, subscriber_share, view_share, views, comments, shares, interactions]
            default: view_share
        - name: post_direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: entityLimit
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 200
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: A bounded, revision-pinned activity rating and top-publication result.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PublicCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'
        '304':
          description: The supplied validator matches this representation.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PublicCache'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/compare:
    get:
      tags: [Query]
      operationId: getComparison
      summary: Read one fixed-cohort comparison
      description: >-
        Executes one set-based query over the ready comparison projection. The response is bounded
        by a fixed horizon and at most 50 series. For Telegram, repeating `channels` selects legacy
        channel IDs; for VK, MAX, and RUTUBE, repeating `institutions` selects legacy institution
        IDs. Only the parameter matching the selected platform is read; the other legacy namespace
        is ignored for browser compatibility. Duplicate relevant IDs are de-duplicated in first
        occurrence order, and unmapped IDs are ignored without replacing them. When the
        platform-specific selection parameter is absent, `institutionLimit` bounds the
        deterministic default slice. Invalid or excess relevant values fail as an invalid request
        and are never replaced by another series. Every series also includes a companion
        engagement curve calculated as a median of per-publication percentages (never a ratio of
        aggregate medians). Telegram uses reactions/views and starts that curve at hour 1; VK and
        RUTUBE use the available reactions, comments, and shares from the same source observation
        divided by views. Metric and engagement cohorts are independently fixed by their valid
        start/end observations, and intermediate hours only carry earlier valid observations
        forward; future observations are never carried backward.
      security: []
      parameters:
        - name: platform
          in: query
          schema:
            type: string
            enum: [telegram, vk, max, rutube]
            default: telegram
        - name: horizonHours
          in: query
          schema:
            type: integer
            enum: [24, 48, 72, 168, 336]
            default: 72
        - name: includePartial
          in: query
          schema:
            type: boolean
            default: false
        - name: metric
          in: query
          schema:
            type: string
            enum: [views, reactions, comments, shares]
            default: reactions
        - name: aggregation
          in: query
          schema:
            type: string
            enum: [sum, median]
            default: median
        - name: institutionLimit
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 50
            default: 25
          description: Bounds the default slice when the platform-specific selection is absent.
        - name: channels
          in: query
          description: Ordered legacy channel IDs for Telegram; ignored for every other platform.
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 50
            items:
              type: integer
              format: int64
              minimum: 1
        - name: institutions
          in: query
          description: Ordered legacy institution IDs for VK, MAX, or RUTUBE; ignored for Telegram.
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 50
            items:
              type: integer
              format: int64
              minimum: 1
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: One ready, revision-pinned fixed cohort.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PublicCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comparison'
        '304':
          description: The supplied validator matches this representation.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PublicCache'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/accounts/{legacyId}:
    get:
      tags: [Query]
      operationId: getAccount
      summary: Resolve a legacy channel or platform-account id
      description: >-
        Returns canonical catalog metadata and a small aggregate from `publication_latest`.
        Subscriber history is intentionally absent because no account-latest projection exists.
      security: []
      parameters:
        - $ref: '#/components/parameters/LegacyId'
        - name: legacyType
          in: query
          schema:
            type: string
            enum: [channels, platform_accounts]
            default: platform_accounts
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Alias-backed account metadata and projection summary.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PublicCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '304':
          description: The supplied validator matches this representation.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PublicCache'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/exports/publications.csv:
    get:
      tags: [Export]
      operationId: streamPublicationCsv
      summary: Stream a revision-pinned publication CSV
      description: Rows are forwarded from the database cursor and are not materialized as a collection.
      security: []
      parameters:
        - $ref: '#/components/parameters/Platform'
      responses:
        '200':
          description: UTF-8 CSV with CRLF records and a header row.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Content-Disposition:
              description: Attachment filename containing the selected platform.
              schema:
                type: string
            X-Dataset-Revision:
              description: Revision used by every row in the export.
              schema:
                type: integer
                format: int64
                minimum: 0
          content:
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/csrf:
    get:
      tags: [Admin]
      operationId: getAdminCsrf
      summary: Issue a double-submit CSRF token for an authenticated admin client
      security:
        - basicAuth: []
      responses:
        '200':
          description: Token metadata; the matching XSRF-TOKEN cookie is also issued.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCsrf'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/jobs:
    get:
      tags: [Admin]
      operationId: getAdminJobs
      summary: Read bounded collection-run status
      description: Requires VIEWER, EDITOR or ADMIN. No raw response or payload is returned.
      security:
        - basicAuth: []
      parameters:
        - name: platform
          in: query
          schema:
            type: string
            enum: [telegram, vk, max, rutube]
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/RunStatus'
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Newest collection runs matching the allowlisted filters.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminJobPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/AdminUnavailable'
  /api/v1/admin/jobs/{jobId}:
    get:
      tags: [Admin]
      operationId: getAdminJob
      summary: Read one collection run and bounded per-account outcomes
      description: Requires VIEWER, EDITOR or ADMIN. Errors are limited to sanitized codes.
      security:
        - basicAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: accountResultLimit
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 100
      responses:
        '200':
          description: Collection run plus bounded account outcomes.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminJobDetail'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/AdminUnavailable'
  /api/v1/admin/platform-accounts/{accountId}:
    get:
      tags: [Admin]
      operationId: getAdminPlatformAccount
      summary: Read the current administrative state of one platform account
      description: >-
        Requires VIEWER, EDITOR or ADMIN. Returns only the account UUID, platform, enabled flag,
        optimistic row version and update time from the dedicated administrative database
        connection. External identifiers, URLs, credentials and raw collector evidence are omitted.
      security:
        - basicAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current state suitable for preparing an optimistic admin command.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPlatformAccountState'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/AdminUnavailable'
  /api/v1/admin/platform-accounts/{accountId}/enabled:
    put:
      tags: [Admin]
      operationId: setAdminPlatformAccountEnabled
      summary: Set the collector-enabled state of one platform account
      description: >-
        Requires EDITOR or ADMIN. The command uses optimistic locking and is idempotent when the
        requested desired state is already current. Success, replay, conflict and not-found outcomes
        are written to append-only audit with only enabled/rowVersion state. A changed command
        rebuilds and publishes its revision-pinned projections in the same database transaction.
      security:
        - basicAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-XSRF-TOKEN
          in: header
          required: true
          description: Token returned by getAdminCsrf; the matching XSRF-TOKEN cookie is required.
          schema:
            type: string
        - name: X-Correlation-Id
          in: header
          required: false
          description: Optional caller UUID; the server generates one when absent.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSetEnabledRequest'
      responses:
        '200':
          description: Updated state or an idempotent no-op.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Correlation-Id:
              description: Correlation UUID used by audit and revision lineage.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSetEnabledResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/OptimisticLockConflict'
        '503':
          $ref: '#/components/responses/AdminUnavailable'
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: >-
        Transitional stateless admin authentication. Store only bcrypt hashes in runtime
        configuration and expose this surface exclusively behind TLS. OIDC remains a later slice.
  parameters:
    Platform:
      name: platform
      in: query
      schema:
        type: string
        enum: [all, telegram, vk, max, rutube]
        default: all
    Period:
      name: period
      in: query
      schema:
        type: string
        enum: [3h, 1d, 7d, 30d]
        default: 1d
    LegacyId:
      name: legacyId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: Current or weak ETag; wildcard matching is supported.
      schema:
        type: string
  headers:
    ETag:
      description: >-
        Validator derived from the same API namespace, authoritative PostgreSQL dataset revision,
        and normalized-query fingerprint used by the public response cache.
      schema:
        type: string
    PublicCache:
      description: Public response cache policy.
      schema:
        type: string
        const: max-age=30, must-revalidate, public
    NoStore:
      description: Response must not be stored.
      schema:
        type: string
        const: no-store
  responses:
    InvalidRequest:
      description: A query, path parameter, or cursor is invalid.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No alias-backed resource exists at this dataset revision.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: An unexpected failure occurred before the response was committed.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Authentication is missing or invalid.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        WWW-Authenticate:
          description: Basic authentication challenge for the transitional admin surface.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The authenticated role cannot perform the requested operation or CSRF failed.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    OptimisticLockConflict:
      description: The supplied expected row version is stale.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AdminUnavailable:
      description: The dedicated administrative database connection is disabled or unavailable.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Liveness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: UP
    Readiness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [UP, DOWN]
        datasetRevision:
          type: integer
          format: int64
          minimum: 0
    Metrics:
      type: object
