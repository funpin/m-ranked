openapi: 3.1.0
info:
  title: M-Ranked API
  version: 1.0.0
  description: >-
    Public reads are backed by revision-pinned projections and legacy identifier aliases.
    Administrative status and account commands are authenticated, role-scoped and never cached.
tags:
  - name: Operations
  - name: Query
  - name: Media
  - name: Export
  - name: Admin
paths:
  /api/v1/health/live:
    get:
      tags: [Operations]
      operationId: getLiveness
      summary: Process liveness
      security: []
      responses:
        '200':
          description: The process can serve HTTP requests.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
  /api/v1/health/ready:
    get:
      tags: [Operations]
      operationId: getReadiness
      summary: Database and dataset readiness
      security: []
      responses:
        '200':
          description: Database access and the current dataset revision are available.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: A required dependency is unavailable.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
  /api/v1/health/legacy:
    get:
      tags: [Operations]
      operationId: getLegacyHealth
      summary: Sanitized legacy health and collector freshness contract
      security: []
      responses:
        '200':
          description: Legacy health shape; collector freshness is explicit and may be false.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyHealth'
        '503':
          description: Operational snapshot unavailable; no internal details are exposed.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthUnavailable'
  /api/v1/health/freshness:
    get:
      tags: [Operations]
      operationId: getCollectorFreshness
      summary: Per-platform freshness and authoritative revision lag
      security: []
      responses:
        '200':
          description: All configured collectors are fresh and all nine projections are published.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorFreshness'
        '503':
          description: A configured collector is stale, failed, or unknown, projections lag, or the snapshot is unavailable.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CollectorFreshness'
                  - $ref: '#/components/schemas/HealthUnavailable'
  /api/v1/emoji/{emojiId}:
    get:
      tags: [Media]
      operationId: getCustomEmoji
      summary: Resolve a Telegram custom emoji to a browser-renderable image
      description: >-
        Compatibility media endpoint for the legacy `/emoji/{emoji_id}` route. Successful images
        are cached in-process for six hours. Metadata, selected assets, and every redirect are
        restricted to HTTPS Telegram hosts on port 443, without userinfo or fragments. Every DNS
        answer must be public and its verified IP is used for TCP connect while TLS verifies the
        original hostname. The complete metadata/redirect/image chain has a ten-second deadline;
        image bodies larger than 2,000,000 bytes are rejected. The six-hour cache is bounded to 32 MiB.
      security: []
      parameters:
        - name: emojiId
          in: path
          required: true
          description: Legacy Telegram custom-emoji document identifier.
          schema:
            type: string
            pattern: '^[0-9]{1,32}$'
      responses:
        '200':
          description: Exact upstream image bytes in a browser-renderable format.
          headers:
            Cache-Control:
              description: Six-hour public browser cache matching the legacy route.
              schema:
                type: string
                const: 'public, max-age=21600'
          content:
            image/webp:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/revision:
    get:
      operationId: getDatasetRevision
      summary: Authoritative published projection revision
      responses:
        '200':
          description: Read from PostgreSQL on every request; never cached.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetRevision'
  /api/v1/overview:
    get:
      tags: [Query]
      operationId: getOverview
      summary: Page through institution metrics
      description: >-
        Uses an opaque keyset cursor over a globally sorted legacy-card projection. Missing sort
        values stay last in both directions. Results and validators are pinned to the dataset
        revision selected at the beginning of the request.
      security: []
      parameters:
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/Period'
        - name: q
          in: query
          description: Case-insensitive institution-name fragment.
          schema:
            type: string
            maxLength: 200
            default: ''
        - name: sort
          in: query
          description: >-
            Legacy sort key. `coverage` and `accounts` apply only to `all`; `posts` and
            `subscribers` apply only to a concrete platform. Unsupported combinations normalize
            to `m_rating` for `all` and `median_reactions` otherwise.
          schema:
            type: string
            enum: [name, median_reactions, m_rating, reactions, views, posts, subscribers, coverage, accounts]
            default: median_reactions
        - name: direction
          in: query
          description: Defaults to ascending for `name`, descending otherwise.
          schema:
            type: string
            enum: [asc, desc]
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          description: Opaque cursor returned as `nextCursor` by a previous response.
          schema:
            type: string
            maxLength: 512
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: A revision-pinned page of metrics.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PublicCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewPage'
        '304':
          description: The supplied validator matches this representation.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PublicCache'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/institutions/{legacyId}:
    get:
      tags: [Query]
      operationId: getInstitution
      summary: Resolve a legacy institution id and return its metrics
      security: []
      parameters:
        - $ref: '#/components/parameters/LegacyId'
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/Period'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Institution and revision-pinned metrics.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PublicCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Institution'
        '304':
          description: The supplied validator matches this representation.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PublicCache'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/publications/{legacyId}:
    get:
      tags: [Query]
      operationId: getPublication
      summary: Resolve a legacy publication id and return latest independent counters
      security: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - name: legacyType
          in: query
          description: Namespace of the legacy identifier.
          schema:
            type: string
            enum: [posts, platform_posts]
            default: posts
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Publication identity and its latest revision-pinned counters.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PublicCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publication'
        '304':
          description: The supplied validator matches this representation.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PublicCache'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/publications/{legacyId}/anomaly-analysis:
    get:
      tags: [Query]
      operationId: getPublicationAnomalyAnalysis
      summary: Read independently published anomaly-dynamics signals
      description: >-
        Reads only a complete persisted analysis publication. suspicionScore is a
        versioned heuristic strength score, not a probability or proof of artificial activity.
      security: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - name: legacyType
          in: query
          schema:
            type: string
            enum: [posts, platform_posts]
            default: posts
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 512
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Persisted publication analysis and bounded active findings.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PublicCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationAnomalyAnalysis'
        '304':
          description: The supplied validator matches this analysis representation.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/rating:
    get:
      tags: [Query]
      operationId: getRating
      summary: Read the legacy activity rating for one platform and period
      description: >-
        Returns activity entities plus the top 50 publications from one dataset revision. Telegram
        ranks enabled channels and keeps channels without publications; VK and RUTUBE aggregate
        institutions that have publications. Metrics come from each publication's coherent latest
        non-synthetic cumulative snapshot. Entities use `entityLimit` and revision-bound `entityCursor` continuation;
        `entitiesTruncated` reports when this target API cannot return the legacy page's unbounded
        tail. Unknown period values accepted by the browser route fall back to `1d`; omission is
        `30d`. This endpoint is separate from official rating observations and derived rating runs.
      security: []
      parameters:
        - name: platform
          in: query
          schema:
            type: string
            enum: [telegram, vk, rutube]
            default: telegram
        - name: period
          in: query
          schema:
            $ref: '#/components/schemas/PeriodValue'
          description: Omission selects 30d; the server retains the legacy invalid-value fallback to 1d.
        - name: channel_sort
          in: query
          schema:
            type: string
            enum: [average, total, engagement, views, subscribers]
            default: engagement
        - name: channel_direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: post_sort
          in: query
          schema:
            type: string
            enum: [reactions, subscriber_share, view_share, views, comments, shares, interactions]
            default: view_share
        - name: post_direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: entityCursor
          in: query
          required: false
          description: Continuation bound to the canonical query and dataset revision; stale cursors return 400 and require restarting pagination.
          schema:
            type: string
            maxLength: 512
        - name: entityLimit
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 200
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: A bounded, revision-pinned activity rating and top-publication result.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PublicCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'
        '304':
          description: The supplied validator matches this representation.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PublicCache'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/compare/candidates:
    get:
      operationId: getComparisonCandidates
      summary: Revision-pinned comparison selector candidates
      parameters:
        - name: platform
          in: query
          schema:
            type: string
            enum: [telegram, vk, max, rutube]
            default: telegram
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 512
      responses:
        '200':
          description: Ordered selector page with continuation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonCandidatePage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
  /api/v1/compare:
    get:
      tags: [Query]
      operationId: getComparison
      summary: Read one fixed-cohort comparison
      description: >-
        Executes one set-based query over the ready comparison projection. The response is bounded
        by a fixed horizon and at most 50 series. For Telegram, repeating `channels` selects legacy
        channel IDs; for VK, MAX, and RUTUBE, repeating `institutions` selects legacy institution
        IDs. Only the parameter matching the selected platform is read; the other legacy namespace
        is ignored for browser compatibility. Duplicate relevant IDs are de-duplicated in first
        occurrence order, and unmapped IDs are ignored without replacing them. When the
        platform-specific selection parameter is absent, `institutionLimit` bounds the
        deterministic default slice. Invalid or excess relevant values fail as an invalid request
        and are never replaced by another series. Every series also includes a companion
        engagement curve calculated as a median of per-publication percentages (never a ratio of
        aggregate medians). Telegram uses reactions/views and starts that curve at hour 1; VK and
        RUTUBE use the available reactions, comments, and shares from the same source observation
        divided by views. Metric and engagement cohorts are independently fixed by their valid
        start/end observations, and intermediate hours only carry earlier valid observations
        forward; future observations are never carried backward.
      security: []
      parameters:
        - name: platform
          in: query
          schema:
            type: string
            enum: [telegram, vk, max, rutube]
            default: telegram
        - name: horizonHours
          in: query
          schema:
            type: integer
            enum: [24, 48, 72, 168, 336]
            default: 72
        - name: includePartial
          in: query
          schema:
            type: boolean
            default: false
        - name: metric
          in: query
          schema:
            type: string
            enum: [views, reactions, comments, shares]
            default: reactions
        - name: aggregation
          in: query
          schema:
            type: string
            enum: [sum, median]
            default: median
        - name: institutionLimit
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 50
            default: 25
          description: Bounds the default slice when the platform-specific selection is absent.
        - name: channels
          in: query
          description: Ordered legacy channel IDs for Telegram; ignored for every other platform.
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 2000
            items:
              type: integer
              format: int64
              minimum: 1
        - name: institutions
          in: query
          description: Ordered legacy institution IDs for VK, MAX, or RUTUBE; ignored for Telegram.
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 2000
            items:
              type: integer
              format: int64
              minimum: 1
        - $ref: '#/components/parameters/IfNoneMatch'
        - name: selectionCursor
          in: query
          description: Revision-bound continuation over default candidates or the supplied ordered selection.
          schema:
            type: string
            maxLength: 512
      responses:
        '200':
          description: One ready, revision-pinned fixed cohort.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PublicCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comparison'
        '304':
          description: The supplied validator matches this representation.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PublicCache'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/accounts/{legacyId}:
    get:
      tags: [Query]
      operationId: getAccount
      summary: Resolve a legacy channel or platform-account id
      description: >-
        Returns canonical catalog metadata and a small aggregate from `publication_latest`.
        Subscriber history is intentionally absent because no account-latest projection exists.
      security: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - name: legacyType
          in: query
          schema:
            type: string
            enum: [channels, platform_accounts]
            default: platform_accounts
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Alias-backed account metadata and projection summary.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PublicCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '304':
          description: The supplied validator matches this representation.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PublicCache'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/legacy-exports/{kind}.csv:
    get:
      tags: [Export]
      operationId: streamLegacyCsv
      summary: Exact legacy snapshots or posts CSV compatibility
      description: >-
        Reproduces /export/snapshots.csv and /export/posts.csv: UTF-8 without BOM,
        Python csv.writer quoting, CRLF, legacy Russian headers, row ordering,
        nullable cells and attachment filenames. Telegram selects the posts namespace;
        all/vk/max/rutube select platform_posts. Unknown parameters are ignored.
        Platform is trimmed and case-folded; tg aliases telegram, общий aliases all,
        and unknown or empty values select telegram. No spreadsheet formula escaping
        is added to this compatibility format. Counters come from a revision-pinned
        derived projection. Missing lexical evidence or unsafe raw JSON fails closed
        with a classified problem, never a silently altered successful CSV.
        Bounded disk spooling completes before headers: 2000000 rows, 512 MiB,
        300 seconds, two generators and four artifacts; expiration is five minutes.
      security: []
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [snapshots, posts] }
        - name: platform
          in: query
          schema: { type: string, default: telegram }
      responses:
        '200':
          description: Byte-compatible legacy CSV; snapshots.csv/posts.csv for Telegram, otherwise kind-platform.csv.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Content-Disposition:
              schema: { type: string }
            X-Dataset-Revision:
              schema: { type: integer, format: int64 }
          content:
            text/csv:
              schema: { type: string }
        '409':
          description: Compatibility cannot be proven. code classifies LEXEMES_MISSING, UNSAFE_RAW_JSON, UNPARSEABLE_RAW_JSON, FIELD_TOO_LARGE, COLD_ARCHIVE_RESTORE_REQUIRED or PROJECTION_NOT_READY. No CSV is returned.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Bounded export quota, rows, bytes or duration exceeded before sending headers.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/exports/publications.csv:
    get:
      tags: [Export]
      operationId: streamPublicationCsv
      summary: Stream a revision-pinned publication CSV
      description: >-
        One REPEATABLE_READ snapshot is streamed through a server cursor into a bounded
        temporary file before headers are committed. Limits: 100000 rows, 32 MiB,
        30 seconds, two concurrent generators, four pending downloads and ten requests
        per minute per API instance. The file expires after five minutes and is removed
        on completed transfer or disconnect. Larger datasets are rejected; this modern
        export does not replace either byte-frozen legacy CSV route.
      security: []
      parameters:
        - $ref: '#/components/parameters/Platform'
      responses:
        '200':
          description: UTF-8 CSV with CRLF records and a header row.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Content-Disposition:
              description: Attachment filename containing the selected platform.
              schema:
                type: string
            X-Dataset-Revision:
              description: Revision used by every row in the export.
              schema:
                type: integer
                format: int64
                minimum: 0
          content:
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          description: Export quota or row/byte/duration limit exceeded; no partial CSV response is committed.
          headers:
            Retry-After:
              schema:
                type: integer
                const: 60
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/catalog/session:
    get:
      tags:
      - Admin
      operationId: getCatalogSession
      summary: getCatalogSession
      description: Requires VIEWER, EDITOR or ADMIN. Authoritative bounded query on the administrative connection.
      security:
      - basicAuth: []
      responses:
        '200':
          description: Consistent private result; never cached.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCatalogSession'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/AdminUnavailable'
  /api/v1/admin/catalog/status:
    get:
      tags:
      - Admin
      operationId: getCatalogStatus
      summary: getCatalogStatus
      description: Requires VIEWER, EDITOR or ADMIN. Authoritative bounded query on the administrative connection.
      security:
      - basicAuth: []
      responses:
        '200':
          description: Consistent private result; never cached.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCatalogStatus'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/AdminUnavailable'
  /api/v1/admin/catalog/institutions:
    get:
      tags:
      - Admin
      operationId: getManagedInstitutions
      summary: getManagedInstitutions
      description: Requires VIEWER, EDITOR or ADMIN. Authoritative bounded query on the administrative connection.
      security:
      - basicAuth: []
      responses:
        '200':
          description: Consistent private result; never cached.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCatalogPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
