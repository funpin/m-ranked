<title>{{TITLE}}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a single reading column of review cards, chart first, facts and a three-way verdict under each. */
:root {
  --bg: #f3f5f7; --surface: #ffffff; --fg: #18212b; --muted: #5b6876; --line: #d9dfe5;
  --views: #2f66d0; --reacts: #1f9a5b; --sign: rgba(214, 69, 96, .16); --promo: rgba(122, 82, 214, .16); --newsign: rgba(214, 146, 40, .22);
  --accent: #2f66d0;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11151a; --surface: #181e25; --fg: #e4e9ee; --muted: #94a1ae; --line: #2a333d;
  --views: #6f9cf0; --reacts: #4cc98a; --sign: rgba(240, 100, 125, .2); --promo: rgba(160, 125, 245, .22); --newsign: rgba(240, 175, 70, .24);
  --accent: #6f9cf0; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11151a; --surface: #181e25; --fg: #e4e9ee; --muted: #94a1ae; --line: #2a333d;
  --views: #6f9cf0; --reacts: #4cc98a; --sign: rgba(240, 100, 125, .2); --promo: rgba(160, 125, 245, .22); --newsign: rgba(240, 175, 70, .24);
  --accent: #6f9cf0; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; display: grid; gap: 36px; }
h1 { font-size: 26px; font-weight: 600; margin: 0; text-wrap: balance; }
h2 { font-size: 19px; font-weight: 600; margin: 0 0 6px; text-wrap: balance; }
.lead, .intro { color: var(--muted); margin: 6px 0 0; max-width: 65ch; }
nav { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 14px; }
nav a { color: var(--accent); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 18px; height: 10px; vertical-align: -1px; margin-right: 6px; border-radius: 2px; }
.wrap > * { min-width: 0; }
.cards { display: grid; gap: 18px; margin-top: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.card header { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.num { font-family: var(--mono); font-weight: 500; }
.meta { color: var(--muted); font-size: 14px; }
svg { width: 100%; height: auto; display: block; }
svg .grid { stroke: var(--line); stroke-width: 1; }
svg .grid.faint { stroke-dasharray: 2 4; }
svg .tick { font: 10px var(--mono); fill: var(--muted); }
svg .tick.v { fill: var(--views); } svg .tick.r { fill: var(--reacts); }
svg .views { fill: none; stroke: var(--views); stroke-width: 1.6; }
svg .reacts { fill: none; stroke: var(--reacts); stroke-width: 1.4; }
svg .band.sign { fill: var(--sign); } svg .band.promo { fill: var(--promo); } svg .band.newsign { fill: var(--newsign); }
.facts { margin: 0; padding-left: 18px; font-size: 14px; display: grid; gap: 2px; }
.note { margin: 0; font-size: 14px; color: var(--muted); }
.verdict { border: 0; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; }
.verdict legend { color: var(--muted); font-size: 13px; padding: 0; margin-bottom: 2px; }
.verdict input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; min-width: 100%; }
th, td { text-align: left; padding: 5px 10px 5px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 500; }
.export { position: sticky; bottom: env(safe-area-inset-bottom, 0px); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.export button { font: inherit; padding: 6px 14px; border-radius: 4px; border: 1px solid var(--accent); background: var(--accent); color: var(--surface); cursor: pointer; }
.export button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.export textarea { width: 100%; font: 12px var(--mono); min-height: 60px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); }
.muted { color: var(--muted); }
</style>
<main class="wrap">
  <header style="display:grid;gap:10px">
    <h1>{{TITLE}}</h1>
    <p class="lead">{{LEAD}}</p>
    <div class="legend"><span><i style="background:var(--views)"></i>просмотры (левая шкала)</span><span><i style="background:var(--reacts)"></i>реакции (правая шкала)</span><span><i style="background:var(--promo)"></i>окно волны</span><span><i style="background:var(--newsign)"></i>новый признак</span><span><i style="background:var(--sign)"></i>признак, который уже был</span></div>
    <nav>{{NAV}}</nav>
  </header>
  {{BODY}}
  <div class="export">
    <button type="button" id="copy">Скопировать оценки</button>
    <span class="muted" id="status">Отметьте карточки и скопируйте оценки в чат.</span>
    <textarea id="out" readonly hidden></textarea>
  </div>
</main>
<script>
(() => {
  const KEY = "cards-verdicts";
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
  for (const [name, value] of Object.entries(saved)) {
    const el = document.getElementById(name + "-" + value); if (el) el.checked = true;
  }
  document.addEventListener("change", (e) => {
    if (e.target.type !== "radio") return;
    saved[e.target.name] = e.target.value;
    try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (err) {}
  });
  const labels = { yes: "заслуживает", no: "не заслуживает", maybe: "спорно" };
  document.getElementById("copy").addEventListener("click", () => {
    const text = Object.entries(saved).sort().map(([k, v]) => k + ": " + labels[v]).join("\n") || "оценок нет";
    const out = document.getElementById("out"), status = document.getElementById("status");
    out.value = text; out.hidden = false;
    const done = () => { status.textContent = "Скопировано: " + Object.keys(saved).length + " оценок."; };
    const fallback = () => { out.select(); status.textContent = "Выделите текст ниже и скопируйте вручную."; };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch (err) { fallback(); }
  });
})();
</script>
