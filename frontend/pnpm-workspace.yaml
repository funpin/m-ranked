packages:
  - packages/*
# js-yaml 4.3.1 приходит транзитивно из инструментов сборки и уязвим к
# CVE-2026-84375; 4.3.2 — исправленный выпуск той же линии.
overrides:
  js-yaml@4: 4.3.2
  # Закрывают переполнение стека GHSA-qhr7-859c-m2p7 и GHSA-6j4f-fj2g-mc7p,
  # сохраняя основную версию, которую ожидает каждый транзитивный потребитель.
  brace-expansion@1: 1.1.20
  brace-expansion@2: 2.1.6
  brace-expansion@5: 5.0.11
  # Транзитивно через next: source-map-js <1.2.2 — отказ в обслуживании цикла
  # событий (GHSA-wq5f-xc86-pv6w), sharp <0.35.5 — уязвимость в librsvg.
  source-map-js@1: 1.2.2
  sharp: 0.35.5
allowBuilds:
  esbuild: true
  unrs-resolver: false
