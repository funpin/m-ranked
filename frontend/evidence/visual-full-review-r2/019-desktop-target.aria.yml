- main:
  - heading "Обзор каналов" [level=1]
  - paragraph: Активность всех публикаций в базе за выбранный период — включая публикации, вышедшие раньше. Это прирост доступных метрик ВКонтакте внутри временного окна, а не сумма текущих показателей только у новых публикаций. Данные других соцсетей в расчёт не попадают.
  - form "Фильтры обзора":
    - text: Поиск вуза
    - searchbox "Поиск вуза"
    - text: Период
    - combobox "Период":
      - option "3 часа"
      - option "Сутки"
      - option "Неделя" [selected]
      - option "Последний месяц"
    - text: Сортировать ⓘ
    - combobox "Сортировать ⓘ":
      - option "Название вуза · алфавит"
      - option "Медиана прироста реакций" [selected]
      - option "М‑Рейтинг ВК · место"
      - option "Прирост реакций"
      - option "Прирост просмотров"
      - option "Новые публикации"
      - option "Подписчики"
    - text: Порядок
    - combobox "Порядок":
      - option "По убыванию" [selected]
      - option "По возрастанию"
    - button "Применить"
    - group "Площадка":
      - text: Площадка
      - radio "Общий"
      - text: Общий
      - radio "TG"
      - text: TG
      - radio "ВК" [checked]
      - text: ВК
      - radio "MAX"
      - text: MAX
      - radio "RUTUBE"
      - text: RUTUBE
