- link "Перейти к содержимому":
  - /url: "#main-content"
- navigation "Основная навигация":
  - link "m-ranked — обзор":
    - /url: /?platform=all
  - button "Включить светлую тему"
  - button "Открыть меню"
- main:
  - heading "Обзор вузов" [level=1]
  - paragraph: "Общий контур вуза: официальные аккаунты и общий М‑Рейтинг без сложения несопоставимых метрик разных площадок."
  - form "Фильтры обзора":
    - text: Поиск вуза
    - searchbox "Поиск вуза"
    - text: Период
    - combobox "Период":
      - option "3 часа"
      - option "Сутки"
      - option "Неделя"
      - option "Последний месяц" [selected]
    - text: Сортировать ⓘ
    - combobox "Сортировать ⓘ":
      - option "Название вуза · алфавит"
      - option "Общий М‑Рейтинг · место" [selected]
      - option "Подключённые площадки"
      - option "Количество аккаунтов"
    - text: Порядок
    - combobox "Порядок":
      - option "По убыванию" [selected]
      - option "По возрастанию"
    - button "Применить"
    - group "Площадка":
      - text: Площадка
      - radio "Общий" [checked]
      - text: Общий
      - radio "TG"
      - text: TG
      - radio "ВК"
      - text: ВК
      - radio "MAX"
      - text: MAX
      - radio "RUTUBE"
      - text: RUTUBE
