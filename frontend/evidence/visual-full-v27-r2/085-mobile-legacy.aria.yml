  - heading "Официальный М‑Рейтинг · соцсети" [level=2]
  - paragraph: "Для каждого вуза загружаются общий рейтинг соцсетей и отдельные места в Telegram, VK, MAX и Rutube. Последний период: ещё не загружен."
