- link "Перейти к содержимому":
  - /url: "#main-content"
- navigation "Основная навигация":
  - link "m-ranked — обзор":
    - /url: /?platform=telegram
    - strong: m-ranked
  - link "Обзор":
    - /url: /?platform=telegram
  - link "Рейтинг":
    - /url: /rating?platform=telegram
  - link "Сравнение":
    - /url: /compare?platform=telegram
  - link "Экспорт CSV":
    - /url: /export/snapshots.csv?platform=telegram
  - link "Управление":
    - /url: /manage?platform=telegram
  - button "Включить светлую тему": Тёмная
- main:
  - heading "Рейтинг каналов и публикаций" [level=1]
  - paragraph: Для каждой публикации берётся её последний замер за выбранный период.
  - form "Настройка рейтинга":
    - text: Период ⓘ
    - combobox "Период ⓘ":
      - option "3 часа"
      - option "Сутки" [selected]
      - option "Неделя"
      - option "Последний месяц"
    - button "Применить"
  - region "Рейтинг активности":
    - heading "Каналы" [level=2]
    - paragraph: Типичная и общая активность каналов в сравнении с размером аудитории.
    - text: "Период: 24 часа По умолчанию: выше показаны каналы с большей долей среднего числа реакций от текущего числа подписчиков."
    - table "Каналы по активности за выбранный период":
      - caption: Каналы по активности за выбранный период
      - rowgroup:
        - row "# Канал Среднее реакций Реакций всего Реакции / подписчики ↓ Подписчики":
          - columnheader "#"
          - columnheader "Канал"
          - columnheader "Среднее реакций":
            - link "Среднее реакций":
              - /url: /rating?platform=telegram&period=1d&channel_sort=average&channel_direction=desc&post_sort=view_share&post_direction=desc
          - columnheader "Реакций всего":
            - link "Реакций всего":
              - /url: /rating?platform=telegram&period=1d&channel_sort=total&channel_direction=desc&post_sort=view_share&post_direction=desc
          - columnheader "Реакции / подписчики ↓":
            - link "Реакции / подписчики ↓":
              - /url: /rating?platform=telegram&period=1d&channel_sort=engagement&channel_direction=asc&post_sort=view_share&post_direction=desc
          - columnheader "Подписчики":
            - link "Подписчики":
              - /url: /rating?platform=telegram&period=1d&channel_sort=subscribers&channel_direction=desc&post_sort=view_share&post_direction=desc
