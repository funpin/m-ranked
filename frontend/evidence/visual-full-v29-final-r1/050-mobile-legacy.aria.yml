- navigation "Основная навигация":
  - link "Логотип m-ranked":
    - /url: /?platform=rutube
    - img "Логотип m-ranked"
  - button "Включить светлую тему"
  - button "Открыть меню"
- main:
  - heading "Рейтинг · Rutube" [level=1]
  - paragraph: Только публикации и замеры Rutube. Данные других площадок в расчёт не входят.
  - text: Период ⓘ
  - combobox "Период ⓘ":
    - option "3 часа"
    - option "Сутки"
    - option "Неделя" [selected]
    - option "Последний месяц"
  - button "Применить"
  - heading "Вузы" [level=2]
  - paragraph: Если у вуза несколько аккаунтов Rutube, их публикации объединяются.
  - text: "Период: 7 дней Вовлечённость: (лайки + комментарии) / просмотры. Это отношение событий, а не уникальных пользователей."
  - table:
    - rowgroup:
      - row "# Вуз Среднее лайков ⓘ Лайков всего ⓘ Просмотры ⓘ Вовлечённость ⓘ ↓ Подписчики ⓘ":
        - columnheader "#"
        - columnheader "Вуз"
        - columnheader "Среднее лайков ⓘ":
          - link "Среднее лайков ⓘ":
            - /url: "?platform=rutube&period=7d&channel_sort=average&channel_direction=desc&post_sort=view_share&post_direction=desc"
        - columnheader "Лайков всего ⓘ":
          - link "Лайков всего ⓘ":
            - /url: "?platform=rutube&period=7d&channel_sort=total&channel_direction=desc&post_sort=view_share&post_direction=desc"
        - columnheader "Просмотры ⓘ":
          - link "Просмотры ⓘ":
            - /url: "?platform=rutube&period=7d&channel_sort=views&channel_direction=desc&post_sort=view_share&post_direction=desc"
        - columnheader "Вовлечённость ⓘ ↓":
          - link "Вовлечённость ⓘ ↓":
            - /url: "?platform=rutube&period=7d&channel_sort=engagement&channel_direction=asc&post_sort=view_share&post_direction=desc"
        - columnheader "Подписчики ⓘ":
          - link "Подписчики ⓘ":
            - /url: "?platform=rutube&period=7d&channel_sort=subscribers&channel_direction=desc&post_sort=view_share&post_direction=desc"
    - rowgroup:
      - row "1 Бета 1 публикаций · 0 комментариев 0.0 0 250 0.00% —":
        - cell "1"
        - cell "Бета 1 публикаций · 0 комментариев":
          - link "Бета":
            - /url: /institutions/2?platform=rutube
          - text: 1 публикаций · 0 комментариев
        - cell "0.0"
        - cell "0"
        - cell "250"
        - cell "0.00%"
        - cell "—"
  - heading "Публикации Rutube" [level=2]
  - paragraph: Последний известный замер каждой публикации, вышедшей за период.
  - text: "Период: 7 дней"
  - table:
    - rowgroup:
      - row "# Публикация Лайки ⓘ Просмотры ⓘ Комментарии ⓘ Вовлечённость ⓘ ↓":
        - columnheader "#"
        - columnheader "Публикация"
        - columnheader "Лайки ⓘ":
          - link "Лайки ⓘ":
            - /url: "?platform=rutube&period=7d&channel_sort=engagement&channel_direction=desc&post_sort=reactions&post_direction=desc"
        - columnheader "Просмотры ⓘ":
          - link "Просмотры ⓘ":
            - /url: "?platform=rutube&period=7d&channel_sort=engagement&channel_direction=desc&post_sort=views&post_direction=desc"
        - columnheader "Комментарии ⓘ":
          - link "Комментарии ⓘ":
            - /url: "?platform=rutube&period=7d&channel_sort=engagement&channel_direction=desc&post_sort=comments&post_direction=desc"
        - columnheader "Вовлечённость ⓘ ↓":
          - link "Вовлечённость ⓘ ↓":
            - /url: "?platform=rutube&period=7d&channel_sort=engagement&channel_direction=desc&post_sort=view_share&post_direction=asc"
    - rowgroup:
      - row "1 Бета · video-1 Открыть публикацию RUTUBE ↗ 0 250 — 0.00%":
        - cell "1"
        - cell "Бета · video-1 Открыть публикацию RUTUBE ↗":
          - link "Бета · video-1":
            - /url: /platform-posts/3
          - link "Открыть публикацию RUTUBE ↗":
            - /url: https://rutube.ru/video/video-1/
        - cell "0"
        - cell "250"
        - cell "—"
        - cell "0.00%"