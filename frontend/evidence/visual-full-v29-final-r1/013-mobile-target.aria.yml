  - region "Как читать сравнение": "Типичное накопление реакций Одна линия — один канал и одна неизменная выборка публикаций на всём горизонте. Точка показывает медианное число реакций на соответствующем целом часу. Конверсия просмотров в реакции Для каждого поста рассчитывается отношение реакций к просмотрам, затем для каждого часа берётся медиана этих процентов по каналу. Это отношение количества реакций, а не точное число людей: один пользователь Telegram Premium может оставить несколько реакций."
  - paragraph: "Полная история: учитываются публикации, замеченные не позднее чем через 6 минут после выхода и имеющие замеры на всём выбранном горизонте."
  - text: Нечего сравнивать. Выберите хотя бы один канал и нажмите «Показать сравнение».
  - heading "Типичное накопление реакций" [level=2]
  - paragraph: Точка — медиана на конкретном целом часу после публикации. Нажмите на вуз в легенде, чтобы скрыть или вернуть его линию.
  - text: Первые 72 часа
  - region "Типичное накопление реакций":
    - list "Легенда графика"
    - paragraph: Клавиши влево и вправо выбирают время; вверх и вниз — линию. Home и End — первая и последняя точка. Escape закрывает подсказку.
    - img "Типичное накопление реакций": Значения и размер выборки каждого ряда приведены в легенде выше.
  - heading "Конверсия просмотров в реакции" [level=2]
  - paragraph: Точка — медиана отношений «реакции / просмотры» у отдельных постов на конкретном часу. Линии включаются и выключаются общей легендой выше.
  - text: Первые 72 часа
