- navigation "Основная навигация":
  - link "Логотип m-ranked m-ranked":
    - /url: /?platform=vk
    - img "Логотип m-ranked"
    - strong: m-ranked
  - link "Обзор":
    - /url: /?platform=vk
  - link "Рейтинг":
    - /url: /rating?platform=vk
  - link "Сравнение":
    - /url: /compare?platform=vk
  - link "Экспорт CSV":
    - /url: /export/snapshots.csv?platform=vk
  - link "Управление":
    - /url: /manage?platform=vk
  - button "Включить светлую тему": Тёмная
- main:
  - heading "Рейтинг · ВКонтакте" [level=1]
  - paragraph: Только публикации и замеры ВКонтакте. Данные других площадок в расчёт не входят.
  - text: Период ⓘ
  - combobox "Период ⓘ":
    - option "3 часа"
    - option "Сутки" [selected]
    - option "Неделя"
    - option "Последний месяц"
  - button "Применить"
  - heading "Вузы" [level=2]
  - paragraph: Если у вуза несколько аккаунтов ВКонтакте, их публикации объединяются.
  - text: "Период: 24 часа Вовлечённость: (лайки + комментарии + репосты) / просмотры. Это отношение событий, а не уникальных пользователей."
  - table:
    - rowgroup:
      - row "# Вуз Среднее лайков ⓘ Лайков всего ⓘ Просмотры ⓘ Вовлечённость ⓘ ↓ Подписчики ⓘ":
        - columnheader "#"
        - columnheader "Вуз"
        - columnheader "Среднее лайков ⓘ":
          - link "Среднее лайков ⓘ":
            - /url: "?platform=vk&period=1d&channel_sort=average&channel_direction=desc&post_sort=view_share&post_direction=desc"
        - columnheader "Лайков всего ⓘ":
          - link "Лайков всего ⓘ":
            - /url: "?platform=vk&period=1d&channel_sort=total&channel_direction=desc&post_sort=view_share&post_direction=desc"
        - columnheader "Просмотры ⓘ":
          - link "Просмотры ⓘ":
            - /url: "?platform=vk&period=1d&channel_sort=views&channel_direction=desc&post_sort=view_share&post_direction=desc"
        - columnheader "Вовлечённость ⓘ ↓":
          - link "Вовлечённость ⓘ ↓":
            - /url: "?platform=vk&period=1d&channel_sort=engagement&channel_direction=asc&post_sort=view_share&post_direction=desc"
        - columnheader "Подписчики ⓘ":
          - link "Подписчики ⓘ":
            - /url: "?platform=vk&period=1d&channel_sort=subscribers&channel_direction=desc&post_sort=view_share&post_direction=desc"
    - rowgroup:
      - row "Данные появятся после первого замера ВКонтакте.":
        - cell "Данные появятся после первого замера ВКонтакте."
  - heading "Публикации ВКонтакте" [level=2]
  - paragraph: Последний известный замер каждой публикации, вышедшей за период.
  - text: "Период: 24 часа"
  - table:
    - rowgroup:
      - row "# Публикация Лайки ⓘ Просмотры ⓘ Комментарии ⓘ Репосты ⓘ Вовлечённость ⓘ ↓":
        - columnheader "#"
        - columnheader "Публикация"
        - columnheader "Лайки ⓘ":
          - link "Лайки ⓘ":
            - /url: "?platform=vk&period=1d&channel_sort=engagement&channel_direction=desc&post_sort=reactions&post_direction=desc"
        - columnheader "Просмотры ⓘ":
          - link "Просмотры ⓘ":
            - /url: "?platform=vk&period=1d&channel_sort=engagement&channel_direction=desc&post_sort=views&post_direction=desc"
        - columnheader "Комментарии ⓘ":
          - link "Комментарии ⓘ":
            - /url: "?platform=vk&period=1d&channel_sort=engagement&channel_direction=desc&post_sort=comments&post_direction=desc"
        - columnheader "Репосты ⓘ":
          - link "Репосты ⓘ":
            - /url: "?platform=vk&period=1d&channel_sort=engagement&channel_direction=desc&post_sort=shares&post_direction=desc"
        - columnheader "Вовлечённость ⓘ ↓":
          - link "Вовлечённость ⓘ ↓":
            - /url: "?platform=vk&period=1d&channel_sort=engagement&channel_direction=desc&post_sort=view_share&post_direction=asc"
    - rowgroup:
      - row "Пока нет публикаций ВКонтакте за выбранный период.":
        - cell "Пока нет публикаций ВКонтакте за выбранный период."