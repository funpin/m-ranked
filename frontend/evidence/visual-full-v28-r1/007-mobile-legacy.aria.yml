- navigation "Основная навигация":
  - link "Логотип m-ranked":
    - /url: /?platform=telegram
    - img "Логотип m-ranked"
  - button "Включить светлую тему"
  - button "Открыть меню"
- main:
  - heading "Рейтинг каналов и публикаций" [level=1]
  - paragraph: Для каждой публикации берётся её последний замер за выбранный период.
  - text: Период ⓘ
  - combobox "Период ⓘ":
    - option "3 часа"
    - option "Сутки"
    - option "Неделя"
    - option "Последний месяц" [selected]
  - button "Применить"
  - heading "Каналы" [level=2]
  - paragraph: Типичная и общая активность каналов в сравнении с размером аудитории.
  - text: "Период: 30 дней По умолчанию: выше показаны каналы с большей долей среднего числа реакций от текущего числа подписчиков."
  - table:
    - rowgroup:
      - row "# Канал Среднее реакций ⓘ Реакций всего ⓘ Реакции / подписчики ⓘ ↓ Подписчики ⓘ":
        - columnheader "#"
        - columnheader "Канал"
        - columnheader "Среднее реакций ⓘ":
          - link "Среднее реакций ⓘ":
            - /url: "?platform=telegram&period=30d&channel_sort=average&channel_direction=desc&post_sort=view_share&post_direction=desc"
        - columnheader "Реакций всего ⓘ":
          - link "Реакций всего ⓘ":
            - /url: "?platform=telegram&period=30d&channel_sort=total&channel_direction=desc&post_sort=view_share&post_direction=desc"
        - columnheader "Реакции / подписчики ⓘ ↓":
          - link "Реакции / подписчики ⓘ ↓":
            - /url: "?platform=telegram&period=30d&channel_sort=engagement&channel_direction=asc&post_sort=view_share&post_direction=desc"
        - columnheader "Подписчики ⓘ":
          - link "Подписчики ⓘ":
            - /url: "?platform=telegram&period=30d&channel_sort=subscribers&channel_direction=desc&post_sort=view_share&post_direction=desc"
