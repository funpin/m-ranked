    - option "Прирост реакций"
    - option "Прирост просмотров"
    - option "Новые публикации"
    - option "Подписчики"
  - text: Порядок
  - combobox "Порядок":
    - option "По убыванию" [selected]
    - option "По возрастанию"
  - button "Применить"
  - group:
    - text: Площадка
    - radio "Общий"
    - text: Общий
    - radio "TG" [checked]
    - text: TG
    - radio "ВК"
    - text: ВК
    - radio "MAX"
    - text: MAX
    - radio "RUTUBE"
    - text: RUTUBE
