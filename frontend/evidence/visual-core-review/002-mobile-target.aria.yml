- link "Перейти к содержимому":
  - /url: "#main-content"
- navigation "Основная навигация":
  - link "m-ranked — обзор":
    - /url: /?platform=telegram
  - button "Включить светлую тему"
  - button "Открыть меню"
- main:
  - heading "Рейтинг каналов и публикаций" [level=1]
  - paragraph: Только публикации и замеры TG. Для каждой публикации берётся последний замер за выбранный период.
  - text: период Последний месяц
  - form "Настройка рейтинга":
    - text: Период
    - combobox "Период":
      - option "3 часа"
      - option "Сутки"
      - option "Неделя"
      - option "Последний месяц" [selected]
    - button "Применить"
  - paragraph: Каналы
  - heading "Рейтинг активности" [level=2]
  - table "Каналы по активности за выбранный период":
    - caption: Каналы по активности за выбранный период
    - rowgroup:
      - row "# Канал Среднее реакций Реакций всего Реакции / подписчики ↓ Подписчики":
        - columnheader "#"
        - columnheader "Канал"
        - columnheader "Среднее реакций":
          - link "Среднее реакций":
            - /url: /rating?platform=telegram&period=30d&channel_sort=average&channel_direction=desc&post_sort=view_share&post_direction=desc
        - columnheader "Реакций всего":
          - link "Реакций всего":
            - /url: /rating?platform=telegram&period=30d&channel_sort=total&channel_direction=desc&post_sort=view_share&post_direction=desc
        - columnheader "Реакции / подписчики ↓":
          - link "Реакции / подписчики ↓":
            - /url: /rating?platform=telegram&period=30d&channel_sort=engagement&channel_direction=asc&post_sort=view_share&post_direction=desc
        - columnheader "Подписчики":
          - link "Подписчики":
