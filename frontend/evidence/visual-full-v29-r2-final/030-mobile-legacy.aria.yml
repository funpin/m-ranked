    - option "Прирост реакций"
    - option "Прирост просмотров"
    - option "Новые публикации"
    - option "Подписчики"
  - text: Порядок
  - combobox "Порядок":
    - option "По убыванию" [selected]
    - option "По возрастанию"
  - button "Применить"
  - group:
    - text: Площадка
    - radio "Общий"
    - text: Общий
    - radio "TG"
    - text: TG
    - radio "ВК"
    - text: ВК
    - radio "MAX" [checked]
    - text: MAX
    - radio "RUTUBE"
