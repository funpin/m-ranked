- link "Перейти к содержимому":
  - /url: "#main-content"
- navigation "Основная навигация":
  - link "m-ranked — обзор":
    - /url: /?platform=all
  - button "Включить светлую тему"
  - button "Открыть меню"
- main:
  - heading "Обзор вузов" [level=1]
  - paragraph: "Общий контур вуза: официальные аккаунты и общий М‑Рейтинг без сложения несопоставимых метрик разных площадок."
  - form "Фильтры обзора":
    - text: Поиск вуза
    - searchbox "Поиск вуза": НетТакогоВуза
    - text: Период
    - combobox "Период":
      - option "3 часа"
      - option "Сутки" [selected]
      - option "Неделя"
      - option "Последний месяц"
    - text: Сортировать ⓘ
    - combobox "Сортировать ⓘ":
      - option "Название вуза · алфавит"
      - option "Общий М‑Рейтинг Общий · место" [selected]
      - option "Подключённые площадки"
      - option "Количество аккаунтов"
    - text: Порядок
    - combobox "Порядок":
      - option "По убыванию" [selected]
      - option "По возрастанию"
    - button "Применить"
    - group "Площадка":
      - text: Площадка
      - radio "Общий" [checked]
      - text: Общий
      - radio "TG"
      - text: TG
      - radio "ВК"
      - text: ВК
      - radio "MAX"
      - text: MAX
      - radio "RUTUBE"
      - text: RUTUBE
  - text: По запросу «НетТакогоВуза» вузы не найдены.
  - paragraph: "Почему нет общей суммы: лайк, реакция, просмотр видео и просмотр поста имеют разный смысл. Общий режим показывает покрытие и официальный общий М‑Рейтинг; единый межплатформенный индекс будет добавлен только после утверждения формулы."
- alert