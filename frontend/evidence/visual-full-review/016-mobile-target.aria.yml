- link "Перейти к содержимому":
  - /url: "#main-content"
- navigation "Основная навигация":
  - link "m-ranked — обзор":
    - /url: /?platform=vk
  - button "Включить светлую тему"
  - button "Открыть меню"
- main:
  - heading "Рейтинг · ВКонтакте" [level=1]
  - paragraph: Только публикации и замеры ВКонтакте. Данные других площадок в расчёт не входят.
  - form "Настройка рейтинга":
    - text: Период ⓘ
    - combobox "Период ⓘ":
      - option "3 часа" [selected]
      - option "Сутки"
      - option "Неделя"
      - option "Последний месяц"
    - button "Применить"
  - region "Рейтинг активности ВК":
    - heading "Вузы" [level=2]
    - paragraph: Если у вуза несколько аккаунтов ВКонтакте, их публикации объединяются.
    - text: "Период: 3 часа Вовлечённость: (лайки + комментарии + репосты) / просмотры. Это отношение событий, а не уникальных пользователей."
    - table "Вузы по активности ВКонтакте":
      - caption: Вузы по активности ВКонтакте
      - rowgroup:
        - row "# Вуз Среднее лайков Лайков всего Просмотры Вовлечённость ↓ Подписчики":
          - columnheader "#"
          - columnheader "Вуз"
          - columnheader "Среднее лайков":
            - link "Среднее лайков":
              - /url: /rating?platform=vk&period=3h&channel_sort=average&channel_direction=desc&post_sort=view_share&post_direction=desc
          - columnheader "Лайков всего":
            - link "Лайков всего":
              - /url: /rating?platform=vk&period=3h&channel_sort=total&channel_direction=desc&post_sort=view_share&post_direction=desc
          - columnheader "Просмотры":
            - link "Просмотры":
              - /url: /rating?platform=vk&period=3h&channel_sort=views&channel_direction=desc&post_sort=view_share&post_direction=desc
          - columnheader "Вовлечённость ↓":
            - link "Вовлечённость ↓":
              - /url: /rating?platform=vk&period=3h&channel_sort=engagement&channel_direction=asc&post_sort=view_share&post_direction=desc
          - columnheader "Подписчики":
            - link "Подписчики":
              - /url: /rating?platform=vk&period=3h&channel_sort=subscribers&channel_direction=desc&post_sort=view_share&post_direction=desc
      - rowgroup
    - paragraph: Данные появятся после первого замера.
  - region "Публикации ВК":
    - heading "Публикации ВКонтакте" [level=2]
    - paragraph: Последний известный замер каждой публикации, вышедшей за период.
    - text: "Период: 3 часа"
    - table "Публикации ВКонтакте по активности":
      - caption: Публикации ВКонтакте по активности
      - rowgroup:
        - row "# Публикация Лайки Просмотры Комментарии Репосты Вовлечённость ↓":
          - columnheader "#"
          - columnheader "Публикация"
          - columnheader "Лайки":
            - link "Лайки":
              - /url: /rating?platform=vk&period=3h&channel_sort=engagement&channel_direction=desc&post_sort=reactions&post_direction=desc
          - columnheader "Просмотры":
            - link "Просмотры":
              - /url: /rating?platform=vk&period=3h&channel_sort=engagement&channel_direction=desc&post_sort=views&post_direction=desc
          - columnheader "Комментарии":
            - link "Комментарии":
              - /url: /rating?platform=vk&period=3h&channel_sort=engagement&channel_direction=desc&post_sort=comments&post_direction=desc
          - columnheader "Репосты":
            - link "Репосты":
              - /url: /rating?platform=vk&period=3h&channel_sort=engagement&channel_direction=desc&post_sort=shares&post_direction=desc
          - columnheader "Вовлечённость ↓":
            - link "Вовлечённость ↓":
              - /url: /rating?platform=vk&period=3h&channel_sort=engagement&channel_direction=desc&post_sort=view_share&post_direction=asc
      - rowgroup
    - paragraph: Пока нет замеров.
- alert