- link "Перейти к содержимому":
  - /url: "#main-content"
- navigation "Основная навигация":
  - link "m-ranked — обзор":
    - /url: /?platform=telegram
  - button "Включить светлую тему"
  - button "Открыть меню"
- main:
  - heading "Обзор каналов" [level=1]
  - paragraph: Активность всех постов в базе за выбранный период — включая публикации, вышедшие раньше. Это прирост реакций и просмотров внутри временного окна, а не сумма текущих показателей только у новых постов.
  - form "Фильтры обзора":
    - text: Поиск вуза
    - searchbox "Поиск вуза": НетТакогоВуза
    - text: Период
    - combobox "Период":
      - option "3 часа"
      - option "Сутки" [selected]
      - option "Неделя"
      - option "Последний месяц"
    - text: Сортировать ⓘ
    - combobox "Сортировать ⓘ":
      - option "Название вуза · алфавит"
      - option "Медиана прироста реакций" [selected]
      - option "М‑Рейтинг TG · место"
      - option "Прирост реакций"
      - option "Прирост просмотров"
      - option "Новые публикации"
      - option "Подписчики"
    - text: Порядок
    - combobox "Порядок":
      - option "По убыванию" [selected]
      - option "По возрастанию"
    - button "Применить"
    - group "Площадка":
      - text: Площадка
      - radio "Общий"
      - text: Общий
      - radio "TG" [checked]
      - text: TG
      - radio "ВК"
      - text: ВК
      - radio "MAX"
      - text: MAX
      - radio "RUTUBE"
      - text: RUTUBE
  - text: По запросу «НетТакогоВуза» вузы не найдены.
  - paragraph: "Как считаются показатели: в карточке показана активность всех отслеживаемых постов, для которых внутри выбранного периода есть сравнимые замеры, а не только новых публикаций. Реакции и просмотры — разница между первым и последним замером внутри окна; прирост до первого замера в период не включается. Для новых постов с полной историей отсчёт идёт от нуля в момент публикации. Медианы — типичный прирост одного поста за это окно и округляются до целого. Плашка у медианы сравнивает типичный прирост с предыдущим таким же периодом и скрывается, если сравнивать не с чем или изменения нет. Метки скачков временно отключены."
- alert