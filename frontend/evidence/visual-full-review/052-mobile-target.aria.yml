- link "Перейти к содержимому":
  - /url: "#main-content"
- navigation "Основная навигация":
  - link "m-ranked — обзор":
    - /url: /?platform=rutube
  - button "Включить светлую тему"
  - button "Открыть меню"
- main:
  - heading "Рейтинг · Rutube" [level=1]
  - paragraph: Только публикации и замеры Rutube. Данные других площадок в расчёт не входят.
  - form "Настройка рейтинга":
    - text: Период ⓘ
    - combobox "Период ⓘ":
      - option "3 часа"
      - option "Сутки"
      - option "Неделя"
      - option "Последний месяц" [selected]
    - button "Применить"
  - region "Рейтинг активности ВК":
    - heading "Вузы" [level=2]
    - paragraph: Если у вуза несколько аккаунтов Rutube, их публикации объединяются.
    - text: "Период: 30 дней Вовлечённость: (лайки + комментарии) / просмотры. Это отношение событий, а не уникальных пользователей."
    - table "Вузы по активности ВКонтакте":
      - caption: Вузы по активности ВКонтакте
      - rowgroup:
        - row "# Вуз Среднее лайков Лайков всего Просмотры Вовлечённость ↓ Подписчики":
          - columnheader "#"
          - columnheader "Вуз"
          - columnheader "Среднее лайков":
            - link "Среднее лайков":
              - /url: /rating?platform=rutube&period=30d&channel_sort=average&channel_direction=desc&post_sort=view_share&post_direction=desc
          - columnheader "Лайков всего":
            - link "Лайков всего":
              - /url: /rating?platform=rutube&period=30d&channel_sort=total&channel_direction=desc&post_sort=view_share&post_direction=desc
          - columnheader "Просмотры":
            - link "Просмотры":
              - /url: /rating?platform=rutube&period=30d&channel_sort=views&channel_direction=desc&post_sort=view_share&post_direction=desc
          - columnheader "Вовлечённость ↓":
            - link "Вовлечённость ↓":
              - /url: /rating?platform=rutube&period=30d&channel_sort=engagement&channel_direction=asc&post_sort=view_share&post_direction=desc
          - columnheader "Подписчики":
            - link "Подписчики":
              - /url: /rating?platform=rutube&period=30d&channel_sort=subscribers&channel_direction=desc&post_sort=view_share&post_direction=desc
