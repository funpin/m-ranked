# Обновления зависимостей — обычными PR в develop (ветки dependabot/*
# разрешены проверкой веток, заголовок «deps: …» — проверкой заголовков).
# Python-зависимости здесь не обновляются: lock-файлы с хешами собирает
# operations/scripts/generate_python_lock.py, Dependabot их не пересоздаст.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # Неделя на отзыв выпуска, прежде чем он попадёт в PR: свежие версии —
    # главный риск цепочки поставок (01.11.2026 в одной группе пришли выпуски
    # трёх- и пятидневной давности).
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    # Типы Node — под мажорную версию рантайма (node:24 в release.yml,
    # engines >=24): с @types/node 26 сборка падает (#65).
    ignore:
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      frontend-minor:
        update-types: [minor, patch]
