name: CI
# Уровень develop: каждая задача и каждый выпуск. Быстрые ворота
# корректности — схема и миграции, все Python-тесты, фронтенд со сборкой,
# секреты в новых коммитах. Тяжёлые ворота выпуска — release-gates.yml.
# Правила веток требуют только итоговое задание develop-gate.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Все действия закреплены коммитом: подвижный тег вида @v6 отдал бы выполнение
# в CI тому, кто перепишет тег в чужом репозитории. Комментарий рядом хранит
# человекочитаемую версию.
jobs:
  canonical-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      POSTGRES_SUPERUSER_PASSWORD: ci-superuser-password
      MIGRATION_DB_PASSWORD: ci-schema-owner-password
      API_READ_DB_PASSWORD: ci-api-read-password
      API_WRITE_ADMIN_DB_PASSWORD: ci-api-admin-password
      COLLECTOR_INGEST_DB_PASSWORD: ci-collector-password
      BACKUP_DB_PASSWORD: ci-backup-password
      MAINTENANCE_DB_PASSWORD: ci-maintenance-password
      ANALYTICS_WORKER_DB_PASSWORD: ci-analytics-worker-password
      OUTBOX_WORKER_DB_PASSWORD: ci-outbox-worker-password
      POSTGRES_PORT: 55439
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y gawk jq
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt -r operations/requirements.txt
      - run: docker compose -f infra/compose.yaml up -d --wait postgres
      - name: Verify one final database contract
        run: |
          docker compose -f infra/compose.yaml exec -T postgres \
            psql --username mranked_bootstrap --dbname mranked --no-psqlrc \
            --set ON_ERROR_STOP=1 --command "SELECT contract_id FROM ops_and_admin.schema_contract"
          test "$(docker compose -f infra/compose.yaml exec -T postgres \
            psql --username mranked_bootstrap --dbname mranked --no-psqlrc \
            --tuples-only --no-align --command \
            "SELECT to_regnamespace('flyway') IS NULL AND to_regnamespace('migration') IS NULL")" = t
      - name: Rehearse the single in-place release package
        run: |
          set -euo pipefail
          container="$(docker compose -f infra/compose.yaml ps -q postgres)"
          db=mranked_release_ci
          docker exec "$container" createdb -U mranked_bootstrap "$db"
          trap 'docker exec "$container" dropdb -U mranked_bootstrap --force "$db"' EXIT
          docker exec "$container" mkdir -p /tmp/mranked-release/operations/sql /tmp/mranked-release/db
          docker exec "$container" ln -s /m-ranked-schema /tmp/mranked-release/db/migrations
          docker cp operations/sql/release-schema-0038-to-0044.sql \
            "$container":/tmp/mranked-release/operations/sql/release-schema-0038-to-0044.sql
          for migration in db/migrations/*.sql; do
            name="${migration##*/}"
            if (( 10#${name:0:4} <= 38 )); then
              docker exec "$container" psql -U mranked_bootstrap -d "$db" \
                --no-psqlrc -v ON_ERROR_STOP=1 -f "/m-ranked-schema/$name" >/dev/null
            fi
          done
          for attempt in 1 2; do
            docker exec "$container" psql -U mranked_bootstrap -d "$db" \
              --no-psqlrc -v ON_ERROR_STOP=1 \
              -f /tmp/mranked-release/operations/sql/release-schema-0038-to-0044.sql >/dev/null
          done
          test "$(docker exec "$container" psql -U mranked_bootstrap -d "$db" -Atc \
            "SELECT to_regclass('analytics.site_summary') IS NOT NULL AND \
                    to_regclass('analytics.bounded_poll_growth_daily') IS NOT NULL AND \
                    to_regclass('analytics.publication_history_page') IS NOT NULL")" = t
      - name: Anomaly worker and public API against disposable PostgreSQL roles
        run: |
          set -euo pipefail
          container="$(docker compose -f infra/compose.yaml ps -q postgres)"
          db=mranked_anomaly_it
          docker exec "$container" createdb -U mranked_bootstrap "$db"
          trap 'docker exec "$container" dropdb -U mranked_bootstrap --force "$db"' EXIT
          for migration in db/migrations/*.sql; do
            docker exec "$container" psql -U mranked_bootstrap -d "$db" \
              --no-psqlrc -v ON_ERROR_STOP=1 -f "/m-ranked-schema/${migration##*/}" >/dev/null
          done
          export MRANKED_ANOMALY_TEST_ADMIN_DSN="postgresql://mranked_bootstrap:${POSTGRES_SUPERUSER_PASSWORD}@127.0.0.1:${POSTGRES_PORT}/$db"
          export MRANKED_ANOMALY_TEST_WORKER_DSN="postgresql://analytics_worker:${ANALYTICS_WORKER_DB_PASSWORD}@127.0.0.1:${POSTGRES_PORT}/$db"
          export MRANKED_ANOMALY_TEST_API_DSN="postgresql://api_read:${API_READ_DB_PASSWORD}@127.0.0.1:${POSTGRES_PORT}/$db"
          .venv/bin/pytest -q tests/test_anomaly_store_postgres.py \
            tests/test_anomaly_worker_postgres.py tests/test_anomaly_norms_job_postgres.py
      - name: Python gates with a protected release-fixture directory
        run: |
          # Provenance tests validate every ancestor's permissions; /tmp is
          # world-writable and cannot represent a protected release root.
          sudo install -d -m 0755 -o "$(id -u)" -g "$(id -g)" /opt/m-ranked-ci-tests
          .venv/bin/pytest -q --basetemp=/opt/m-ranked-ci-tests/pytest
      - if: always()
        run: docker compose -f infra/compose.yaml down --volumes --remove-orphans
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: canonical-integrity-evidence
          path: .pytest_cache
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm lint && pnpm typecheck && pnpm check:api && pnpm test
        working-directory: frontend
      # Сборка — на каждом PR: сломанная сборка, найденная только на выпуске,
      # держит весь develop.
      - run: MRANKED_DEPLOYMENT_ID="$GITHUB_SHA" pnpm build && pnpm check:bundle
        working-directory: frontend
  secrets-diff:
    # Новые коммиты задачи. Всю историю проверяет supply-chain в release-gates.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secrets in the commits this change brings
        env:
          # Для PR — диапазон от базы, для push — от прежней вершины ветки.
          RANGE_FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
          RANGE_TO: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --output gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          if [[ "$RANGE_FROM" =~ ^0+$ || -z "$RANGE_FROM" ]] \
              || ! git cat-file -e "$RANGE_FROM^{commit}" 2>/dev/null; then
            ./gitleaks git --redact --no-banner --exit-code 1 .
          else
            ./gitleaks git --redact --no-banner --exit-code 1 \
              --log-opts="$RANGE_FROM..$RANGE_TO" .
          fi
  develop-gate:
    # Единственная обязательная проверка уровня develop: список заданий
    # меняется здесь, а не в настройках правил веток.
    if: always()
    needs: [canonical-integrity, frontend, secrets-diff]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "::error::не все ворота develop прошли"; exit 1; }
          done
