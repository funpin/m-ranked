bind 127.0.0.1 ::1
protected-mode yes
port 6379
tcp-backlog 128
timeout 0
tcp-keepalive 60
databases 1
save ""
appendonly no
dir /run/m-ranked-redis
logfile ""
maxclients 256
# Бюджет данных — две трети мягкого предела службы (MemoryHigh=288M):
# сверху ложатся накладные расходы аллокатора и буферы клиентов. При 256mb
# Redis с этими расходами упирался ровно в предел, ядро отнимало у него
# страницы, и 10.10 он стоял 60 % времени — кэш отвечал таймаутами.
maxmemory 192mb
# Вытесняются только записи со сроком жизни (ответы и замки пересчёта):
# набор LRU и наборы тегов без срока — служебные, их потеря рассогласует
# кэш. Записи сжаты (api/cache.py), 8192 штук помещаются с запасом.
maxmemory-policy volatile-lru
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
rename-command FLUSHALL ""
rename-command FLUSHDB ""
