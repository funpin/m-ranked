<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Обновление сервиса · m-ranked</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;background:#10151b;color:#edf2f7;font:16px/1.6 system-ui,sans-serif;display:grid;place-items:center;padding:28px}
main{width:100%;max-width:760px}
.brand{color:#8abcf5;font-weight:750;letter-spacing:.04em}
h1{font-size:clamp(30px,5vw,46px);line-height:1.15;letter-spacing:-.035em;margin:24px 0 18px}
.status{display:inline-flex;align-items:center;gap:9px;color:#d7e7fb;font-size:14px;background:#1b2a3b;border:1px solid #30445d;padding:6px 12px;border-radius:99px}
.status:before{content:"";width:7px;height:7px;background:#8abcf5;border-radius:50%}
.counts{display:grid;grid-template-columns:repeat(2,1fr);gap:32px;margin:38px 0 24px}
.count{border-top:1px solid #33404f;padding-top:14px}
.count span{display:block;color:#9eacbd;font-size:13px}
.count strong{display:block;font-size:clamp(21px,4vw,30px);font-variant-numeric:tabular-nums;line-height:1.5}
.bar{height:10px;border-radius:8px;background:#263342;overflow:hidden}
.fill{width:0;height:100%;background:#80b6f6;transition:width .5s}
.meta{display:flex;justify-content:space-between;gap:20px;color:#9eacbd;font-size:13px;margin:12px 0 25px}
#connection{color:#ffd29d;font-size:14px;min-height:1.6em}
a{color:#9dc9ff;text-underline-offset:4px}
@media(max-width:480px){body{padding:22px}.counts{gap:18px}.count strong{font-size:21px}.meta{display:block}.meta span{display:block;margin-top:6px}}
</style>
<main>
  <div class="brand">m-ranked</div>
  <h1>Обновляем сервис<br>и переносим данные</h1>
  <div class="status">Сбор данных работает</div>
  <div class="counts" aria-live="polite" aria-atomic="true">
    <div class="count"><span>Уже сохранено в PostgreSQL</span><strong id="rows">—</strong></div>
    <div class="count"><span>Размер БД</span><strong id="database-size">—</strong></div>
  </div>
  <div class="bar" id="bar" role="progressbar" aria-label="Заполнение диска" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="fill"></div></div>
  <div class="meta"><span id="disk">Ожидаем данные о диске</span><span id="updated">Обновление статуса каждые 30 секунд</span></div>
  <div id="connection" role="status"></div>
  <noscript><p>Для автоматического обновления счётчиков включите JavaScript. <a href="/migration-status.json">Текущий статус в JSON</a>.</p></noscript>
</main>
<script>
const format=new Intl.NumberFormat('ru-RU');
const decimal=new Intl.NumberFormat('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2});
const el=id=>document.getElementById(id);
async function update(){
  try{
    const response=await fetch('/migration-status.json',{cache:'no-store',signal:AbortSignal.timeout(8000)});
    if(!response.ok)throw new Error('status');
    const data=await response.json();
    if(!Number.isSafeInteger(data.databaseRows)||data.databaseRows<0||!Number.isFinite(data.databaseSizeGiB)||data.databaseSizeGiB<0||!Number.isFinite(data.diskUsedPercent)||data.diskUsedPercent<0||data.diskUsedPercent>100||!Number.isFinite(Date.parse(data.updatedAt)))throw new Error('invalid');
    el('rows').textContent=format.format(data.databaseRows);
    el('database-size').textContent=decimal.format(data.databaseSizeGiB)+' ГБ';
    el('fill').style.width=data.diskUsedPercent+'%';
    el('bar').setAttribute('aria-valuenow',data.diskUsedPercent.toFixed(2));
    el('disk').textContent='Диск заполнен на '+decimal.format(data.diskUsedPercent)+'%';
    el('updated').textContent='Статус на '+new Date(data.updatedAt).toLocaleString('ru-RU',{timeZone:'Europe/Moscow'})+' МСК';
    el('connection').textContent='';
  }catch{
    el('connection').textContent='Не удалось обновить статус. Повторим через 10 секунд; показанные значения не изменены.';
  }finally{setTimeout(update,10000)}
}
update();
</script>
</html>
