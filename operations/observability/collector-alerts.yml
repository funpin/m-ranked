groups:
  - name: mranked-collectors
    rules:
      - alert: MRankedCollectorFailures
        expr: sum by (platform) (rate(mranked_collector_account_duration_seconds_count{outcome="failed"}[15m])) / clamp_min(sum by (platform) (rate(mranked_collector_account_duration_seconds_count[15m])), 0.001) > 0.1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Collector account failures exceed ten percent.
      - alert: MRankedCollectorStale
        expr: (time() - mranked_collector_last_success_unixtime{platform!="rutube"} > 2700) or (time() - mranked_collector_last_success_unixtime{platform="rutube"} > 5400)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Collector account progress exceeds its platform freshness window.
      - alert: MRankedCollectorScheduleLag
        expr: (mranked_collector_schedule_lag_seconds{platform!="rutube"} > 1800) or (mranked_collector_schedule_lag_seconds{platform="rutube"} > 5400)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Exclusive phase capacity cannot keep up with desired cadence.
      - alert: MRankedCollectorMetricsMissing
        expr: node_textfile_scrape_error > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A collector textfile cannot be scraped.
      - alert: MRankedCollectorLatency
        expr: histogram_quantile(0.95, sum by (platform, le) (rate(mranked_collector_account_duration_seconds_bucket[15m]))) > 60
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Collector account p95 latency exceeds sixty seconds.
      - alert: MRankedTransferCursorRegression
        expr: (delta(mranked_transfer_last_produced_cursor[15m]) < 0) or (delta(mranked_transfer_last_acknowledged_cursor[15m]) < 0) or (delta(mranked_transfer_last_applied_cursor[15m]) < 0)
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Transfer cursor regressed for a producer.
      - alert: MRankedTransferAttemptWindowExhausted
        # The batch is safe and still pending; what needs a human is the reason
        # the consumer has been unreachable for a whole retry window.
        expr: mranked_transfer_attempt_window_exhausted_rows > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A transfer batch used its hourly attempt budget without an ACK.
      - alert: MRankedTransferClientAuthRejected
        expr: increase(mranked_transfer_ingest_rejects_total{reason="client_certificate_required"}[15m]) > 0 or increase(mranked_transfer_ingest_rejects_total{reason="producer_identity_mismatch"}[15m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Transfer ingest refused a client certificate or a producer identity.
      - alert: MRankedTransferBacklogOld
        expr: mranked_transfer_oldest_backlog_age_seconds > 1800
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Oldest unacknowledged canonical batch exceeds thirty minutes.
      - alert: MRankedTransferChecksumFailures
        expr: increase(mranked_transfer_checksum_failures_total[15m]) >= 2
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Transfer checksum verification is failing repeatedly.
      - alert: MRankedTransferSchemaMismatch
        expr: increase(mranked_transfer_quarantines_total[15m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: DataAdapter quarantined an incompatible or invalid envelope.
      - alert: MRankedTransferAccountingMismatch
        expr: mranked_transfer_unaccounted_records > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Applied inbox records are not fully accounted.
      - alert: MRankedTransferDiskWarning
        expr: 100 * (1 - node_filesystem_avail_bytes{mountpoint="/var/lib/postgresql"} / node_filesystem_size_bytes{mountpoint="/var/lib/postgresql"}) >= 70
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Transfer storage reached the 70 percent warning watermark.
      - alert: MRankedTransferDiskThrottleBackfill
        expr: 100 * (1 - node_filesystem_avail_bytes{mountpoint="/var/lib/postgresql"} / node_filesystem_size_bytes{mountpoint="/var/lib/postgresql"}) >= 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Pause transfer backfill at the 80 percent disk watermark.
      - alert: MRankedTransferDiskPauseLowPriority
        expr: 100 * (1 - node_filesystem_avail_bytes{mountpoint="/var/lib/postgresql"} / node_filesystem_size_bytes{mountpoint="/var/lib/postgresql"}) >= 90
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Pause low-priority collection; never purge unacknowledged batches.
