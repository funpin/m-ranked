groups:
  - name: mranked-operations
    rules:
      - alert: MRankedMonitoringProducerStale
        expr: time() - mranked_ops_sample_unixtime > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Operational metric production has stopped.
      - alert: MRankedMonitoringSourceUnavailable
        expr: mranked_ops_source_up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: An operational monitoring dependency is unavailable.
      - alert: MRankedOutboxBacklog
        expr: mranked_ops_pending_outbox > 1000
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Durable outbox delivery is not keeping up with committed changes.
      - alert: MRankedReplicationMissingOrLate
        expr: mranked_ops_replication_connected < 1 or mranked_ops_replication_replay_lag_seconds > 900
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Standby replication is missing or exceeds the recovery objective.
      - alert: MRankedWalArchiveLate
        expr: time() - mranked_ops_wal_last_archived_unixtime > 900 or increase(mranked_ops_wal_archive_failures_total[15m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: WAL archival has failed or is late.
      - alert: MRankedSpoolBacklog
        expr: mranked_ops_spool_oldest_age_seconds{kind="wal"} > 900
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: WAL spool backlog exceeds fifteen minutes.
      - alert: MRankedArchiveFenceStuck
        expr: mranked_ops_archive_fenced > 0
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: A cold archive partition fence needs operator investigation.
      - alert: MRankedDiskForecast
        expr: predict_linear(mranked_ops_free_bytes[6h], 86400) < 0 or mranked_ops_free_bytes < mranked_ops_required_5x_bytes
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Measured disk growth or the 5x capacity scenario exceeds available storage.
      - alert: MRankedAnomalyWorkerMetricsStale
        expr: mranked_anomaly_due_backlog > 0 and time() - mranked_anomaly_last_completion_unixtime > 900
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Anomaly analysis has due posts but its worker textfile is stale.
      - alert: MRankedAnomalyQueueLag
        expr: mranked_anomaly_queue_lag_seconds > 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: The oldest due anomaly analysis is more than an hour late; 7-30 day intervals are being stretched.
      - alert: MRankedAnomalyWorkerFailures
        expr: increase(mranked_anomaly_analyses_total{outcome="failed"}[1h]) > 20
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Anomaly analysis is repeatedly failing on individual posts.
      - alert: MRankedAnomalyNormNeedsReview
        expr: mranked_anomaly_norm_latest_status{status="drift_review"} == 1
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: A new anomaly norm version shifted sharply and waits for manual review; analysis stays on the previous accepted version.
      - alert: MRankedAnomalyNormJobStale
        expr: time() - mranked_anomaly_norm_last_run_unixtime > 172800
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: The nightly anomaly norm rebuild has not completed for two days.
      - record: mranked_ops_inserted_rows_per_day
        expr: sum(rate(mranked_ops_inserted_rows_total[1h])) * 86400
  - name: m-ranked-storage
    rules:
      - alert: MRankedBackupStale
        expr: time() - mranked_backup_last_success_unixtime > 36 * 3600
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: No successful full database dump for more than 36 hours.
      - alert: MRankedStorageReserveLow
        expr: mranked_storage_heavy_job_allowed == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Free disk is below the operating reserve plus the next heavy job; backups and backfills will refuse to start.
      - alert: MRankedDockerReclaimable
        expr: mranked_host_docker_reclaimable_bytes > 5e9
        for: 6h
        labels:
          severity: info
        annotations:
          summary: Docker could free more than 5 GB; review exact image IDs (other projects share the host, no automatic prune).
      - alert: MRankedHostGcStale
        expr: time() - mranked_host_gc_last_run_unixtime > 3 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: Release garbage collection has not run for three days.
