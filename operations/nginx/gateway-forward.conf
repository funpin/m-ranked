# Заголовки от шлюза рендера к приложению. Шлюз видит только 127.0.0.1,
# поэтому адрес клиента и схема берутся из того, что прислал публичный слой.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $http_x_real_ip;
proxy_set_header X-Forwarded-For $http_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
proxy_set_header X-Request-ID $http_x_request_id;
proxy_set_header X-MRanked-Client "";
proxy_set_header Connection "";
proxy_connect_timeout 3s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
proxy_next_upstream off;
proxy_buffering on;
proxy_request_buffering on;
# Срок кэша страницы задаёт приложение (X-Accel-Expires по возрасту поста), а
# nginx по умолчанию такие заголовки дальше не передаёт. Без этой строки шлюз
# съедал срок, публичный слой держал страницы 5 с (proxy_cache_valid) и после
# этого отдавал устаревшую копию с фоновым рендером на каждый заход (замер
# 18.10.2026: Next — x-accel-expires 3600, у публичного слоя — STALE через 8 с).
proxy_pass_header X-Accel-Expires;
