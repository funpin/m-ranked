# Install in the nginx http context as /etc/nginx/conf.d/m-ranked.conf.
#
# Рядом в /etc/m-ranked/nginx/ ставятся traffic.conf, crawler-policy.conf,
# build.conf (пишет выкатка, образец build.conf.example), site.conf,
# page-cache-location.conf, site-forward.conf, gateway-forward.conf,
# proxy-common.conf и security-headers.conf. Каталоги кэша:
#   install -d -o www-data -g www-data -m 0700 /var/cache/nginx/m-ranked-pages /var/cache/nginx/m-ranked-static
upstream m_ranked_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Порт API зависит от профиля: 8080 на одном сервере, 18080 на Сервере 2.
upstream m_ranked_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

include /etc/m-ranked/nginx/traffic.conf;

server {
    listen 80;
    listen [::]:80;
    server_name m.funpin.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name m.funpin.org;

    ssl_certificate /etc/letsencrypt/live/m.funpin.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/m.funpin.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MRANKED_TLS:10m;
    client_max_body_size 1m;
    server_tokens off;

    include /etc/m-ranked/nginx/site.conf;
}
