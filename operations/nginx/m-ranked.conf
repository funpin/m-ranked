# Install in the nginx http context as /etc/nginx/conf.d/m-ranked.conf.
upstream m_ranked_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream m_ranked_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=m_ranked_public:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=m_ranked_api:10m rate=10r/s;
# Административная поверхность — единственная, где угадывают пароль, поэтому
# её порог отдельный и много ниже публичного. Счётчик по учётной записи живёт
# в приложении: адрес злоумышленник меняет, имя записи — нет.
limit_req_zone $binary_remote_addr zone=m_ranked_admin:10m rate=2r/s;
limit_req_status 429;

# Роботы. 24.09.2026 GPTBot за сутки обошёл 56 тысяч страниц публикаций по
# два-три запроса в секунду с трёх адресов: каждая страница строится заново
# из холодной истории замеров, и два ядра Сервера 2 стояли загруженными
# полностью. Роботы, собирающие тексты для обучения и поиска ИИ, получают
# 403 на всё, кроме robots.txt, где им сказано то же самое. Запросы,
# которые ИИ делает по просьбе живого человека (ChatGPT-User и подобные),
# сюда не входят — они попадают под общий лимит роботов ниже.
map $http_user_agent $m_ranked_ai_crawler {
    default 0;
    "~*(GPTBot|OAI-SearchBot|ClaudeBot|Claude-SearchBot|anthropic-ai|CCBot|Amazonbot|Bytespider|meta-externalagent|FacebookBot|PerplexityBot|Google-Extended|Applebot-Extended|cohere-ai|cohere-training-data-crawler|Diffbot|ImagesiftBot|Omgilibot|YouBot|Timpibot|AI2Bot|PanguBot|Kangaroo Bot|Sidetrade|img2dataset|webzio-extended|MistralAI-User|DuckAssistBot|QualifiedBot)" 1;
}
map "$m_ranked_ai_crawler:$uri" $m_ranked_blocked_crawler {
    default 0;
    "~^1:(?!/robots\.txt$)" 1;
}
# Остальные роботы (поисковики, превью ссылок, SEO-сканеры) обходят сайт не
# быстрее запроса в секунду с адреса. Живые посетители ключа не получают и
# этот лимит не замечают: пустой ключ nginx не учитывает.
map $http_user_agent $m_ranked_crawler_key {
    default "";
    "~*(bot|crawl|spider|slurp|scrap|fetch|preview|-User)" $binary_remote_addr;
}
limit_req_zone $m_ranked_crawler_key zone=m_ranked_crawlers:10m rate=1r/s;

server {
    listen 80;
    listen [::]:80;
    server_name m.funpin.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name m.funpin.org;

    ssl_certificate /etc/letsencrypt/live/m.funpin.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/m.funpin.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MRANKED_TLS:10m;
    client_max_body_size 1m;
    server_tokens off;

    if ($m_ranked_blocked_crawler) { return 403; }

    gzip on;
    gzip_vary on;
    gzip_types application/javascript application/json application/problem+json
        application/wasm image/svg+xml text/css text/plain;

    location ^~ /api/v1/admin/ {
        limit_req zone=m_ranked_admin burst=10 nodelay;
        proxy_pass http://m_ranked_api;
        include /etc/m-ranked/nginx/proxy-common.conf;
        include /etc/m-ranked/nginx/security-headers.conf;
        # Ответ API — JSON: исполнять и встраивать в рамку в нём нечего.
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    }

    location ^~ /api/v1/ {
        limit_req zone=m_ranked_api burst=20 nodelay;
        limit_req zone=m_ranked_crawlers burst=10;
        proxy_pass http://m_ranked_api;
        include /etc/m-ranked/nginx/proxy-common.conf;
        include /etc/m-ranked/nginx/security-headers.conf;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    }

    location ^~ /_next/static/ {
        # Serve immutable assets from the same Next.js process that rendered
        # the HTML.  Reading them through /opt/m-ranked/current made nginx
        # depend on release-directory traversal permissions and could mix an
        # HTML response from one build with static files from another while
        # the release symlink was being switched.
        proxy_pass http://m_ranked_web;
        include /etc/m-ranked/nginx/proxy-common.conf;
        proxy_hide_header Cache-Control;
        access_log off;
        # Nginx only adds this on successful/cacheable responses.  `always`
        # would also make a transient 403/404 immutable in browser caches.
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/m-ranked/nginx/security-headers.conf;
    }

    location / {
        limit_req zone=m_ranked_public burst=40 nodelay;
        limit_req zone=m_ranked_crawlers burst=10;
        proxy_pass http://m_ranked_web;
        include /etc/m-ranked/nginx/proxy-common.conf;
    }

    include /etc/m-ranked/nginx/security-headers.conf;
}
