# Теневой слушатель: тот же стек без публичного адреса и без TLS.
#
# Нужен, чтобы проверить web и API до того, как DNS укажет на этот сервер.
# Доступен только с петлевого интерфейса, поэтому наружу его не отдать даже
# при ошибке в firewall. Административная поверхность закрыта наглухо:
# проверочный контур не должен давать вход в админку.
server {
    listen 127.0.0.1:18090;
    server_name localhost;
    client_max_body_size 1m;
    server_tokens off;

    location = /api/v1/admin { return 404; }
    location ^~ /api/v1/admin/ { return 404; }

    location ^~ /api/v1/ {
        proxy_pass http://m_ranked_api;
        include /etc/m-ranked/nginx/proxy-common.conf;
    }

    location ^~ /_next/static/ {
        alias /opt/m-ranked/current/frontend/.next/static/;
        access_log off;
        log_not_found off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://m_ranked_web;
        include /etc/m-ranked/nginx/proxy-common.conf;
    }

    include /etc/m-ranked/nginx/security-headers.conf;
}
