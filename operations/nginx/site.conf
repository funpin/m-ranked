# Общие location публичного сайта. Контекст server: одинаков для всех имён
# (m.funpin.org, .ru, .su), отличаются только сертификаты. Переменные, зоны и
# шлюз рендера объявлены в traffic.conf.

if ($m_ranked_blocked_crawler) { return 403; }

access_log /var/log/nginx/m-ranked-access.log m_ranked_traffic;

gzip on;
gzip_vary on;
gzip_types application/javascript application/json application/problem+json
    application/wasm application/xml image/svg+xml text/css text/plain;

# Админка идёт мимо шлюза и кэша: её защищает свой лимит и счётчик
# попыток по учётной записи в приложении.
location ^~ /api/v1/admin/ {
    limit_req zone=m_ranked_admin burst=10 nodelay;
    proxy_pass http://m_ranked_api;
    include /etc/m-ranked/nginx/proxy-common.conf;
    include /etc/m-ranked/nginx/security-headers.conf;
    # Ответ API — JSON: исполнять и встраивать в рамку в нём нечего.
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
}

# Публичный API кэширует сам (Redis); через шлюз — ради пула ботов.
location ^~ /api/v1/ {
    limit_req zone=m_ranked_api burst=20 nodelay;
    proxy_pass http://m_ranked_gateway;
    include /etc/m-ranked/nginx/site-forward.conf;
    include /etc/m-ranked/nginx/security-headers.conf;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
}

location ^~ /_next/static/ {
    # Статику отдаёт тот же процесс Next, что рисовал HTML: чтение через
    # /opt/m-ranked/current смешивало бы файлы двух сборок во время
    # переключения релиза. Кэш снимает с Next повторы.
    proxy_cache m_ranked_static;
    proxy_cache_key "$host$request_uri|$m_ranked_gzip";
    proxy_set_header Accept-Encoding $m_ranked_gzip;
    proxy_cache_valid 200 30d;
    proxy_cache_lock on;
    proxy_pass http://m_ranked_web;
    include /etc/m-ranked/nginx/proxy-common.conf;
    proxy_hide_header Cache-Control;
    access_log off;
    # Nginx добавляет это только к удачным ответам: `always` закрепил бы в
    # браузере на год и случайный 403/404.
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/m-ranked/nginx/security-headers.conf;
}

# Управление: без кэша и мимо шлюза, серверные действия — POST.
location ^~ /manage {
    limit_req zone=m_ranked_public burst=40 nodelay;
    proxy_pass http://m_ranked_web;
    include /etc/m-ranked/nginx/proxy-common.conf;
}

# Эмодзи неизменны: срок берётся из ответа (Cache-Control приложения).
location ^~ /emoji/ {
    limit_req zone=m_ranked_public burst=80 nodelay;
    proxy_pass http://m_ranked_gateway;
    include /etc/m-ranked/nginx/site-forward.conf;
    proxy_cache m_ranked_pages;
    proxy_cache_key "emoji|$host$request_uri";
    proxy_cache_valid 200 6h;
    proxy_cache_lock on;
    proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
}

location / {
    limit_req zone=m_ranked_public burst=40 nodelay;
    proxy_pass http://m_ranked_gateway;
    include /etc/m-ranked/nginx/site-forward.conf;
    include /etc/m-ranked/nginx/page-cache-location.conf;
}

include /etc/m-ranked/nginx/security-headers.conf;
