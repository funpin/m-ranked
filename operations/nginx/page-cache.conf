# Микрокэш готовых страниц. Включается в контекст http.
#
# Отрисовка обзора стоит около 110 мс процессорного времени, а ядро на машине
# одно и занято почти непрерывно, поэтому на стене те же 110 мс превращаются в
# 200–400. Страница публична и одинакова для всех: тема выбирается на клиенте,
# кук публичные маршруты не ставят. Значит, второй такой же запрос в ближайшие
# секунды можно отдать не считая заново.
#
# Срок намеренно короткий. Данные и так обновляются не чаще раза в десять
# секунд на стороне API, и пять секунд поверх этого ничего не меняют в цифрах,
# зато снимают повторную отрисовку.
proxy_cache_path /var/cache/nginx/m-ranked levels=1:2 keys_zone=m_ranked_pages:8m
                 max_size=128m inactive=60s use_temp_path=off;
