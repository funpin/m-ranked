# Маршруты с микрокэшем публичных страниц.
#
# Отличается от routes-active.conf правилами кэширования в корневом блоке.
# Панель управления и API как были, так и остались без кэша.

# PostgreSQL-only cutover fence. Public reads remain available, while direct
# admin calls and Next.js server-action POSTs under /manage are rejected.
location = /api/v1/admin { return 503; }
location ^~ /api/v1/admin/ { return 503; }
location ^~ /api/v1/ {
    limit_req zone=m_ranked_api burst=20 nodelay;
    proxy_pass http://m_ranked_target_api;
    include /etc/m-ranked/nginx/proxy-common.conf;
}
location ^~ /_next/static/ {
    alias /opt/m-ranked/current/frontend/.next/static/;
    access_log off;
    log_not_found off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/m-ranked/nginx/security-headers.conf;
}
location ^~ /manage {
    limit_except GET HEAD { deny all; }
    proxy_pass http://m_ranked_target_web;
    include /etc/m-ranked/nginx/proxy-common.conf;
}
location / {
    proxy_pass http://m_ranked_target_web;
    include /etc/m-ranked/nginx/proxy-common.conf;
    include /etc/m-ranked/nginx/page-cache-location.conf;
}
