# Маршруты с микрокэшем публичных страниц.
#
# Отличается от routes-active.conf правилами кэширования в корневом блоке.
# Панель управления и API как были, так и остались без кэша.

# ИИ-роботам — 403 на всё, кроме robots.txt; карта объявлена в m-ranked.conf.
if ($m_ranked_blocked_crawler) { return 403; }

# PostgreSQL-only cutover fence. Public reads remain available, while direct
# admin calls and Next.js server-action POSTs under /manage are rejected.
location = /api/v1/admin { return 503; }
location ^~ /api/v1/admin/ { return 503; }
location ^~ /api/v1/ {
    limit_req zone=m_ranked_api burst=20 nodelay;
    limit_req zone=m_ranked_crawlers burst=10;
    proxy_pass http://m_ranked_target_api;
    include /etc/m-ranked/nginx/proxy-common.conf;
}
location ^~ /_next/static/ {
    # Keep HTML and immutable assets on one deployed Next.js build.  A direct
    # alias through /opt/m-ranked/current both depended on release-directory
    # traversal permissions and raced the atomic release-symlink switch.
    proxy_pass http://m_ranked_target_web;
    include /etc/m-ranked/nginx/proxy-common.conf;
    proxy_hide_header Cache-Control;
    access_log off;
    log_not_found off;
    # Never pin a transient 403/404 in browser caches for a year.
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/m-ranked/nginx/security-headers.conf;
}
location ^~ /manage {
    limit_except GET HEAD { deny all; }
    proxy_pass http://m_ranked_target_web;
    include /etc/m-ranked/nginx/proxy-common.conf;
}
location / {
    limit_req zone=m_ranked_crawlers burst=10;
    proxy_pass http://m_ranked_target_web;
    include /etc/m-ranked/nginx/proxy-common.conf;
    include /etc/m-ranked/nginx/page-cache-location.conf;
}
