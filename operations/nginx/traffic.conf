# Трафик сайта: классы клиентов, пулы рендера и кэш готовых страниц.
# Контекст http, ставится в /etc/m-ranked/nginx/traffic.conf и подключается
# из m-ranked.conf. Upstream m_ranked_web и m_ranked_api объявлены там же.
#
# Почему так. 24.09.2026 GPTBot обходил по две-три уникальные страницы
# публикаций в секунду. Каждая строилась заново из холодной истории замеров,
# и два ядра Сервера 2 стояли загруженными полностью: страдали люди. Кэш
# против такого обхода почти бесполезен — бот каждый раз приходит за новой
# страницей. Поэтому запросы идут в два слоя:
#
#   публичный server  → ищет готовую страницу в кэше; попадание ничего не стоит;
#   шлюз рендера      → получает только промахи и решает, кого пустить в Next
#                       и API: у ботов общий ограниченный пул, у людей свой.
#
# Лимиты стоят на шлюзе, а не на входе: на входе они резали бы и дешёвые
# попадания. Когда пул ботов занят, шлюз отвечает 503 с Retry-After, а
# публичный слой вместо этого отдаёт устаревшую копию, если она есть.

# Входные лимиты по адресу: считают все запросы, включая попадания в кэш, и
# ловят только грубый поток с одного адреса.
limit_req_zone $binary_remote_addr zone=m_ranked_public:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=m_ranked_api:10m rate=10r/s;
# Административная поверхность — единственная, где угадывают пароль, поэтому
# её порог отдельный и много ниже публичного. Счётчик по учётной записи живёт
# в приложении: адрес злоумышленник меняет, имя записи — нет.
limit_req_zone $binary_remote_addr zone=m_ranked_admin:10m rate=2r/s;
limit_req_status 429;

# Класс клиента по User-Agent. Первое совпадение выигрывает, поэтому запросы
# ИИ по просьбе человека и поисковые ИИ-роботы стоят раньше обучающих, а
# общий шаблон роботов — последним.
map $http_user_agent $m_ranked_agent_class {
    default human;
    "~*(ChatGPT-User|Claude-User|Perplexity-User|MistralAI-User|DuckAssistBot)" ai_user;
    "~*(OAI-SearchBot|Claude-SearchBot|PerplexityBot|YouBot)" ai_search;
    "~*(GPTBot|ClaudeBot|anthropic-ai|CCBot|Amazonbot|Bytespider|meta-externalagent|FacebookBot|Google-Extended|Applebot-Extended|cohere-ai|cohere-training-data-crawler|Diffbot|ImagesiftBot|Omgilibot|Timpibot|AI2Bot|PanguBot|Kangaroo Bot|Sidetrade|img2dataset|webzio-extended|QualifiedBot)" ai_training;
    "~*(bot|crawl|spider|slurp|scrap|fetch|preview|python-requests|python-httpx|aiohttp|go-http-client|headless|curl/|wget/)" crawler;
}

# Какие классы сейчас закрыты — отдельным файлом, чтобы открытие было одной
# правкой: /etc/m-ranked/nginx/crawler-policy.conf.
include /etc/m-ranked/nginx/crawler-policy.conf;

# Закрытым классам — 403 на всё, кроме robots.txt: там им сказано то же самое.
map "$m_ranked_class_blocked:$uri" $m_ranked_blocked_crawler {
    default 0;
    "~^1:(?!/robots\.txt$)" 1;
}

# --- Ключи лимитов. Пустой ключ nginx не учитывает. ---

# Все боты делят один пул одновременных рендеров.
map $m_ranked_agent_class $m_ranked_bot_pool {
    default bots;
    human "";
}
# И у каждого класса ботов своя скорость промахов.
map $m_ranked_agent_class $m_ranked_bot_class_key {
    default $m_ranked_agent_class;
    human "";
}
# Люди ограничены по адресу — только промахами и только страницами. Адрес
# клиента шлюз получает от публичного слоя: сам он видит лишь 127.0.0.1.
# Предзагрузка Next дешёвая и в лимит не входит.
map "$m_ranked_agent_class:$http_next_router_prefetch" $m_ranked_human_miss_key {
    default "";
    "human:" $http_x_mranked_client;
}

limit_conn_zone $m_ranked_bot_pool zone=m_ranked_bot_renders:1m;
limit_req_zone $m_ranked_bot_class_key zone=m_ranked_bot_rate:1m rate=5r/s;
limit_req_zone $m_ranked_human_miss_key zone=m_ranked_human_misses:10m rate=2r/s;

# --- Кэш готовых страниц. ---

# Сборка входит в ключ: HTML ссылается на чанки конкретной сборки, и после
# выкатки прежние страницы становятся неверными. Файл пишет выкатка.
include /etc/m-ranked/nginx/build.conf;

# Адрес в ключе кэша. Пока совпадает с запрошенным; отбрасывание незначимых
# параметров для роботов добавляется здесь же.
map $request_uri $m_ranked_cache_uri {
    default $request_uri;
}

# Обход кэша (?nocache=1) — только с самого сервера, для проверок.
map "$remote_addr:$arg_nocache" $m_ranked_cache_bypass {
    default "";
    "~^(127\.0\.0\.1|::1):1$" 1;
}

# Сжатие: Next сжимает сам, и сжатый ответ нельзя отдать клиенту без gzip.
map $http_accept_encoding $m_ranked_gzip {
    default "";
    "~*gzip" gzip;
}

# Срок хранения задаёт приложение заголовком X-Accel-Expires (по возрасту
# поста). Без него страница живёт несколько секунд — микрокэш от повторов.
proxy_cache_path /var/cache/nginx/m-ranked-pages levels=1:2 keys_zone=m_ranked_pages:32m
                 max_size=3g inactive=7d use_temp_path=off;
# Статика сборки неизменна: Next отдаёт каждый файл один раз.
proxy_cache_path /var/cache/nginx/m-ranked-static levels=1:2 keys_zone=m_ranked_static:4m
                 max_size=512m inactive=30d use_temp_path=off;

# Журнал с классом клиента и исходом кэша: по нему считаются доля попаданий,
# доля 503 ботам и промахи по классам.
log_format m_ranked_traffic '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                            '$request_time $m_ranked_agent_class $upstream_cache_status '
                            '"$http_user_agent"';

upstream m_ranked_gateway {
    server 127.0.0.1:18091;
    keepalive 32;
}

# Шлюз рендера. Слушает только петлю: снаружи до него не достать, поэтому
# заголовкам X-MRanked-* от публичного слоя можно верить.
server {
    listen 127.0.0.1:18091;
    server_name m-ranked-render-gateway;
    server_tokens off;
    client_max_body_size 1m;
    access_log off;

    limit_conn_status 503;
    limit_req_status 503;
    error_page 503 = @m_ranked_overloaded;

    location @m_ranked_overloaded {
        add_header Retry-After 120 always;
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        return 503 "Сервер занят, повторите позже.\n";
    }

    location ^~ /api/v1/ {
        limit_conn m_ranked_bot_renders 4;
        limit_req zone=m_ranked_bot_rate burst=10;
        proxy_pass http://m_ranked_api;
        include /etc/m-ranked/nginx/gateway-forward.conf;
    }

    # Картинки эмодзи и файлы из public: дёшевы и идут пачками на одну
    # страницу, лимит промахов людей к ним не относится.
    location ~ ^/(emoji/|icons/|splash/|apple-touch-icon|favicon|manifest\.webmanifest|robots\.txt|sitemap) {
        limit_conn m_ranked_bot_renders 4;
        limit_req zone=m_ranked_bot_rate burst=10;
        proxy_pass http://m_ranked_web;
        include /etc/m-ranked/nginx/gateway-forward.conf;
    }

    location / {
        limit_conn m_ranked_bot_renders 4;
        limit_req zone=m_ranked_bot_rate burst=10;
        limit_req zone=m_ranked_human_misses burst=10 nodelay;
        proxy_pass http://m_ranked_web;
        include /etc/m-ranked/nginx/gateway-forward.conf;
    }
}
