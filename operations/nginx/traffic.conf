# Трафик сайта: классы клиентов, пулы рендера и кэш готовых страниц.
# Контекст http, ставится в /etc/m-ranked/nginx/traffic.conf и подключается
# из m-ranked.conf. Upstream m_ranked_web и m_ranked_api объявлены там же.
#
# Почему так. 24.09.2026 GPTBot обходил по две-три уникальные страницы
# публикаций в секунду. Каждая строилась заново из холодной истории замеров,
# и два ядра Сервера 2 стояли загруженными полностью: страдали люди. Кэш
# против такого обхода почти бесполезен — бот каждый раз приходит за новой
# страницей. Поэтому запросы идут в два слоя:
#
#   публичный server  → ищет готовую страницу в кэше; попадание ничего не стоит;
#   шлюз рендера      → получает только промахи и решает, кого пустить в Next
#                       и API: у ботов общий ограниченный пул, у людей свой.
#
# Лимиты стоят на шлюзе, а не на входе: на входе они резали бы и дешёвые
# попадания. Когда пул ботов занят, шлюз отвечает 503 с Retry-After, а
# публичный слой вместо этого отдаёт устаревшую копию, если она есть.

# Входные лимиты по адресу: считают все запросы, включая попадания в кэш, и
# ловят только грубый поток с одного адреса.
limit_req_zone $binary_remote_addr zone=m_ranked_public:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=m_ranked_api:10m rate=10r/s;
# Административная поверхность — единственная, где угадывают пароль, поэтому
# её порог отдельный и много ниже публичного. Счётчик по учётной записи живёт
# в приложении: адрес злоумышленник меняет, имя записи — нет.
limit_req_zone $binary_remote_addr zone=m_ranked_admin:10m rate=2r/s;
# Маячок посещений: страница шлёт его при открытии и раз в минуту.
limit_req_zone $binary_remote_addr zone=m_ranked_visit:10m rate=1r/s;
limit_req_status 429;

# Класс клиента по User-Agent. Первое совпадение выигрывает, поэтому запросы
# ИИ по просьбе человека и поисковые ИИ-роботы стоят раньше обучающих, затем
# SEO-сервисы, а общий шаблон роботов — последним.
map $http_user_agent $m_ranked_agent_class {
    default human;
    "~*(ChatGPT-User|Claude-User|Perplexity-User|MistralAI-User|DuckAssistBot)" ai_user;
    # meta-webindexer — индекс поиска Meta AI. 31.10.2026 с 22:50 до 00:30 он
    # с ~400 адресов IPv6 открыл 6,3 тыс. разных постов (до 100 в минуту, все
    # мимо кэша), и приём пачек с Сервера 1 отстал на 22 минуты.
    "~*(OAI-SearchBot|Claude-SearchBot|PerplexityBot|YouBot|meta-webindexer)" ai_search;
    "~*(GPTBot|ClaudeBot|anthropic-ai|CCBot|Amazonbot|Bytespider|meta-externalagent|FacebookBot|Google-Extended|Applebot-Extended|cohere-ai|cohere-training-data-crawler|Diffbot|ImagesiftBot|Omgilibot|Timpibot|AI2Bot|PanguBot|Kangaroo Bot|Sidetrade|img2dataset|webzio-extended|QualifiedBot)" ai_training;
    # SEO-сервисы (решение владельца 18.10.2026): не поисковики, на выдачу не
    # влияют, а обходят все страницы постов — за 15 дней до 18.10 это 41% всего
    # времени рендера промахов. По списку страниц из их базы 18.10 шёл обход
    # через тысячи домашних прокси. Стоят раньше общего шаблона.
    "~*(SemrushBot|SiteAuditBot|SplitSignalBot|AhrefsBot|AhrefsSiteAudit|MJ12bot|SERankingBacklinksBot|SERankingBot|DotBot|BLEXBot|DataForSeoBot|serpstatbot|Barkrowler|MegaIndex|Screaming Frog|ZoominfoBot)" seo;
    # Поисковики выдачи — свой пул рендера: чужой обход не должен отнимать у
    # них индексацию. Applebot-Extended (обучение) уже пойман выше.
    "~*(Googlebot|Google-InspectionTool|YandexBot|YandexMobileBot|YandexRenderResourcesBot|bingbot|Applebot|DuckDuckBot)" search;
    "~*(bot|crawl|spider|slurp|scrap|fetch|preview|python-requests|python-httpx|aiohttp|go-http-client|headless|curl/|wget/)" crawler;
}

# Какие классы сейчас закрыты — отдельным файлом, чтобы открытие было одной
# правкой: /etc/m-ranked/nginx/crawler-policy.conf.
include /etc/m-ranked/nginx/crawler-policy.conf;

# Закрытым классам — 403 на всё, кроме robots.txt: там им сказано то же самое.
map "$m_ranked_class_blocked:$uri" $m_ranked_blocked_crawler {
    default 0;
    "~^1:(?!/robots\.txt$)" 1;
}

# --- Ключи лимитов. Пустой ключ nginx не учитывает. ---

# Пулы одновременных рендеров: поисковики выдачи — свой, остальные роботы —
# один общий. Каждый пул — один рендер. Холодная страница поста стоит роботу
# около 2 с (31.10.2026: медиана 1,7 с, среднее 2,0 с), а ядер два: прежние
# четыре рендера на всех роботов занимали весь процессор, и приёму пачек и
# людям оставалось только ждать.
map $m_ranked_agent_class $m_ranked_bot_pool {
    default bots;
    search search;
    human "";
}
# И у каждого класса ботов своя скорость промахов.
map $m_ranked_agent_class $m_ranked_bot_class_key {
    default $m_ranked_agent_class;
    human "";
}
# Скорость холодных страниц: по классу, у поисковиков свой потолок. За 14
# дней до 31.10 Google давал до 12 промахов в минуту, Applebot — до 25,
# Яндекс и Bing — единицы; прочие обходчики — до 100.
map $m_ranked_agent_class $m_ranked_bot_page_key {
    default $m_ranked_agent_class;
    search "";
    human "";
}
map $m_ranked_agent_class $m_ranked_search_page_key {
    default "";
    search search;
}
# Люди ограничены по адресу — только промахами и только страницами. Адрес
# клиента шлюз получает от публичного слоя: сам он видит лишь 127.0.0.1.
# Предзагрузка Next дешёвая и в лимит не входит.
map "$m_ranked_agent_class:$http_next_router_prefetch" $m_ranked_human_miss_key {
    default "";
    "human:" $http_x_mranked_client;
}

# --- Проверка на браузер (pass.js) ---
# Анонимный промах страницы без куки mr_pass получает от шлюза страницу с
# лёгкой задачей на JS, а не рендер: 18.10.2026 обходчик с тысяч домашних
# адресов (класс human, по запросу с адреса) выкачивал холодные страницы постов
# по ~0,9 с процессора каждая. Модуль ngx_http_js_module — пакет
# libnginx-mod-http-js; секрет подписи — pass-secret.conf (не в репозитории).
js_import m_ranked_pass from /etc/m-ranked/nginx/pass.js;
include /etc/m-ranked/nginx/pass-secret.conf;
js_set $m_ranked_pass m_ranked_pass.valid;
# Проверки с самого сервера (?nocache=1, замеры) — без задачи.
map $http_x_mranked_client $m_ranked_local_client {
    default 0;
    "127.0.0.1" 1;
    "::1" 1;
}
# Кому задача: человеку, GET/HEAD, не предзагрузке Next, не с сервера, без
# действующей куки, не файлам сборки. Кука вычисляется только здесь — то есть
# только на промахах страниц в шлюзе.
map "$m_ranked_agent_class|$request_method|$http_next_router_prefetch|$m_ranked_local_client|$m_ranked_pass|$uri" $m_ranked_challenge {
    default 0;
    "~^human\|(GET|HEAD)\|\|0\|0\|/(?!_next/)" 1;
}

# --- Лимит по странам ---
# 18.10.2026 91% запросов обходчика шли не из России и СНГ, а в обычные дни
# из 19,6 тыс. «человеческих» открытий страниц за 14 дней на Россию и СНГ
# пришлась треть — остальное дата-центры с браузерным User-Agent. Посетители
# из других стран с кукой проверки делят свой общий потолок холодных страниц
# поста, аккаунта и вуза, отдельный от потолка своих (m_ranked_human_detail):
# обход из-за рубежа настоящими браузерами не отнимает запас у России и СНГ.
# Обычно таких открытий до 7 в минуту (99-й процентиль). Совсем страны не
# закрываются: российские пользователи VPN выходят из Германии, Нидерландов,
# США. Список «своих» сетей — geo-home.conf, собирает
# operations/scripts/build-geo-home.py из DB-IP Lite; без него — образец
# geo-home.conf.example (все «свои», лимит не действует).
include /etc/m-ranked/nginx/geo-home.conf;
map "$m_ranked_agent_class|$m_ranked_home_country|$http_next_router_prefetch|$http_rsc|$arg__rsc|$uri" $m_ranked_foreign_detail_key {
    default "";
    "~^human\|0\|\|\|\|/(publications|accounts|institutions)/[^/]+$" foreign;
}
limit_req_zone $m_ranked_foreign_detail_key zone=m_ranked_foreign_detail:1m rate=10r/m;

limit_conn_zone $m_ranked_bot_pool zone=m_ranked_bot_renders:1m;
limit_req_zone $m_ranked_bot_class_key zone=m_ranked_bot_rate:1m rate=5r/s;
limit_req_zone $m_ranked_bot_page_key zone=m_ranked_bot_pages:1m rate=12r/m;
limit_req_zone $m_ranked_search_page_key zone=m_ranked_search_pages:1m rate=30r/m;
limit_req_zone $m_ranked_human_miss_key zone=m_ranked_human_misses:10m rate=2r/s;

# Общий потолок промахов людей по страницам поста, аккаунта и вуза — по всем
# адресам вместе. 18.10.2026 обходчик с тысяч домашних адресов и браузерными
# User-Agent (класс human, по запросу на адрес) открывал до 160 холодных
# страниц постов в минуту по ≈0,9 с процессора каждая, и два ядра стояли
# полностью. Обычные люди открывают такие страницы с нуля не чаще 5–20 раз в
# минуту; переходы внутри сайта (RSC, предзагрузка) в потолок не входят.
# Считаются только посетители из России и СНГ: у остальных свой потолок
# (m_ranked_foreign_detail), и обход из-за рубежа — 91% запросов 18.10 — не
# расходует запас своих.
map "$m_ranked_agent_class:$m_ranked_home_country:$http_next_router_prefetch:$http_rsc:$arg__rsc:$uri" $m_ranked_human_detail_key {
    default "";
    "~^human:1::::/(publications|accounts|institutions)/[^/]+$" detail;
}
limit_req_zone $m_ranked_human_detail_key zone=m_ranked_human_detail:1m rate=10r/m;

# --- Кэш готовых страниц. ---

# Сборка входит в ключ: HTML ссылается на чанки конкретной сборки, и после
# выкатки прежние страницы становятся неверными. Файл пишет выкатка.
include /etc/m-ranked/nginx/build.conf;

# Роботам страницы поста, аккаунта и вуза отдаются в каноническом виде: без
# параметров (history_limit, day, trend, platform, period…). Иначе каждый
# вариант — отдельная страница и отдельный промах: 24.09 GPTBot 20 тысяч раз
# открыл посты с ?history_limit. Параметры отбрасываются и в запросе к
# приложению (site.conf), и в ключе кэша — только в ключе нельзя: тяжёлый
# вариант лёг бы в кэш под каноническим адресом, и его получили бы люди.
map "$m_ranked_agent_class:$uri" $m_ranked_bot_canonical {
    default 0;
    "~^(ai_user|ai_search|ai_training|seo|search|crawler):/(publications|accounts)/[0-9a-fA-F-]{36}$" 1;
    "~^(ai_user|ai_search|ai_training|seo|search|crawler):/institutions/[0-9]+$" 1;
}
map $m_ranked_bot_canonical $m_ranked_cache_uri {
    default $request_uri;
    1 $uri;
}

# Обход кэша (?nocache=1) — только с самого сервера, для проверок.
map "$remote_addr:$arg_nocache" $m_ranked_cache_bypass {
    default "";
    "~^(127\.0\.0\.1|::1):1$" 1;
}

# Сжатие: Next сжимает сам, и сжатый ответ нельзя отдать клиенту без gzip.
map $http_accept_encoding $m_ranked_gzip {
    default "";
    "~*gzip" gzip;
}

# Срок хранения задаёт приложение заголовком X-Accel-Expires (по возрасту
# поста). Без него страница живёт несколько секунд — микрокэш от повторов.
# Объём — гигабайт: вытесняются давно не открытые страницы, в основном посты,
# которые робот прочитал один раз; людям нужные страницы остаются (3 ГБ на
# 7 суток держали 2 ГБ таких страниц).
proxy_cache_path /var/cache/nginx/m-ranked-pages levels=1:2 keys_zone=m_ranked_pages:32m
                 max_size=1g inactive=3d use_temp_path=off;
# Статика сборки неизменна: Next отдаёт каждый файл один раз.
proxy_cache_path /var/cache/nginx/m-ranked-static levels=1:2 keys_zone=m_ranked_static:4m
                 max_size=512m inactive=30d use_temp_path=off;

# Журнал с классом клиента и исходом кэша: по нему считаются доля попаданий,
# доля 503 ботам и промахи по классам.
log_format m_ranked_traffic '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                            '$request_time $m_ranked_agent_class $upstream_cache_status '
                            '"$http_user_agent"';

upstream m_ranked_gateway {
    server 127.0.0.1:18091;
    keepalive 32;
}

# Шлюз рендера. Слушает только петлю: снаружи до него не достать, поэтому
# заголовкам X-MRanked-* от публичного слоя можно верить.
server {
    listen 127.0.0.1:18091;
    server_name m-ranked-render-gateway;
    server_tokens off;
    client_max_body_size 1m;
    access_log off;

    limit_conn_status 503;
    limit_req_status 503;
    error_page 503 = @m_ranked_overloaded;

    location @m_ranked_overloaded {
        add_header Retry-After 120 always;
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        return 503 "Сервер занят, повторите позже.\n";
    }

    location ^~ /api/v1/ {
        limit_conn m_ranked_bot_renders 1;
        limit_req zone=m_ranked_bot_pages burst=5 nodelay;
        limit_req zone=m_ranked_search_pages burst=10 nodelay;
        proxy_pass http://m_ranked_api;
        include /etc/m-ranked/nginx/gateway-forward.conf;
    }

    # Картинки эмодзи и файлы из public: дёшевы и идут пачками на одну
    # страницу, лимит промахов людей к ним не относится.
    location ~ ^/(emoji/|icons/|splash/|apple-touch-icon|favicon|manifest\.webmanifest|robots\.txt|sitemap) {
        # Файлы дешёвые: свой потолок, шире страничного.
        limit_conn m_ranked_bot_renders 4;
        limit_req zone=m_ranked_bot_rate burst=10;
        proxy_pass http://m_ranked_web;
        include /etc/m-ranked/nginx/gateway-forward.conf;
    }

    # Решение задачи проверки: кука и возврат на страницу (pass.js).
    location = /__pass {
        # Шлюз знает только себя (127.0.0.1:18091): абсолютный Location увёл
        # бы браузер туда. Относительный путь браузер достроит сам.
        absolute_redirect off;
        js_content m_ranked_pass.issue;
    }

    location @m_ranked_challenge {
        js_content m_ranked_pass.challenge;
    }

    location / {
        # Задача — до лимитов: человек без куки до рендера не доходит и
        # общий запас промахов не расходует.
        if ($m_ranked_challenge) { return 418; }
        error_page 418 = @m_ranked_challenge;
        # error_page в location отменяет наследование серверного — повторяем.
        error_page 503 = @m_ranked_overloaded;
        # Робот сверх своего рендера или скорости сразу получает 503 с
        # Retry-After, а публичный слой отдаёт вместо него устаревшую копию:
        # ожидание в очереди держало бы единственный рендер пула.
        limit_conn m_ranked_bot_renders 1;
        limit_req zone=m_ranked_bot_pages burst=5 nodelay;
        limit_req zone=m_ranked_search_pages burst=10 nodelay;
        limit_req zone=m_ranked_human_misses burst=10 nodelay;
        limit_req zone=m_ranked_human_detail burst=20 nodelay;
        limit_req zone=m_ranked_foreign_detail burst=10 nodelay;
        proxy_pass http://m_ranked_web;
        include /etc/m-ranked/nginx/gateway-forward.conf;
    }
}
