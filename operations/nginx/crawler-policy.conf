# Какие классы роботов закрыты (403 на всё, кроме robots.txt). Контекст http,
# ставится в /etc/m-ranked/nginx/crawler-policy.conf.
#
# Классы определяет traffic.conf: human, ai_user (запрос ИИ по просьбе
# человека), ai_search (поисковые ИИ-роботы), ai_training (сбор для
# обучения), seo (SEO-сервисы: Semrush, Ahrefs, Majestic…), search (поисковики выдачи:
# Google, Яндекс, Bing, Apple), crawler (прочие роботы). Открытие класса — удалить его строку
# здесь и в robots.txt (frontend/app/robots.ts), затем nginx -t и reload.
#
# ai_search открыт с 13.11.2026 (решение владельца): без него поиск ChatGPT,
# Claude и Perplexity не может найти и процитировать сайт, а ИИ-поисковики не
# из списка (ExaSearchBot) и так ходили классом crawler. Цена ограничена тем же,
# что у crawler: свои 12 холодных страниц в минуту и общий для роботов один
# рендер. Закрыть снова — вернуть строку «ai_search 1;» и Disallow в robots.ts.
map $m_ranked_agent_class $m_ranked_class_blocked {
    default 0;
    ai_training 1;
    seo 1;
}
