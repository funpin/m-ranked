# Какие классы роботов закрыты (403 на всё, кроме robots.txt). Контекст http,
# ставится в /etc/m-ranked/nginx/crawler-policy.conf.
#
# Классы определяет traffic.conf: human, ai_user (запрос ИИ по просьбе
# человека), ai_search (поисковые ИИ-роботы), ai_training (сбор для
# обучения), crawler (прочие роботы). Открытие класса — удалить его строку
# здесь и в robots.txt (frontend/app/robots.ts), затем nginx -t и reload.
map $m_ranked_agent_class $m_ranked_class_blocked {
    default 0;
    ai_search 1;
    ai_training 1;
}
