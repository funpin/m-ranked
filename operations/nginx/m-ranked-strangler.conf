# Install in the nginx http context (normally /etc/nginx/conf.d). The active
# location set is an operator-controlled atomic copy; see CUTOVER.md.
upstream m_ranked_legacy {
    server 127.0.0.1:8090;
    keepalive 16;
}

upstream m_ranked_target_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream m_ranked_target_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=m_ranked_public:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=m_ranked_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name m.funpin.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    include /etc/m-ranked/nginx/security-headers.conf;
}

server {
    # HAProxy terminates the public listener and forwards by SNI here.
    listen 127.0.0.1:8443 ssl;
    server_name m.funpin.org;

    ssl_certificate /etc/letsencrypt/live/m.funpin.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/m.funpin.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MRANKED_TLS:10m;
    ssl_session_timeout 1d;

    client_max_body_size 1m;
    limit_req zone=m_ranked_public burst=40 nodelay;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/problem+json
        application/wasm image/svg+xml text/css text/plain;

    # The file is copied atomically from routes/*.conf only after its gate.
    include /etc/m-ranked/nginx/routes-active.conf;

    include /etc/m-ranked/nginx/security-headers.conf;
    server_tokens off;
}

# Shadow traffic is reachable only through an operator SSH tunnel on the host.
# It is never forwarded by HAProxy or exposed by the public firewall.
server {
    listen 127.0.0.1:18090;
    server_name localhost;
    client_max_body_size 1m;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/problem+json
        application/wasm image/svg+xml text/css text/plain;

    location = /api/v1/admin {
        return 404;
    }

    location ^~ /api/v1/admin/ {
        return 404;
    }

    location ^~ /api/v1/ {
        limit_req zone=m_ranked_api burst=20 nodelay;
        proxy_pass http://m_ranked_target_api;
        include /etc/m-ranked/nginx/proxy-common.conf;
    }

    location ^~ /_next/static/ {
        alias /opt/m-ranked/current/frontend/.next/static/;
        access_log off;
        log_not_found off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/m-ranked/nginx/security-headers.conf;
    }

    location / {
        proxy_pass http://m_ranked_target_web;
        include /etc/m-ranked/nginx/proxy-common.conf;
    }


    include /etc/m-ranked/nginx/security-headers.conf;
}
