# Правила кэширования для публичных страниц. Включается внутри location /.
#
# Один адрес отдаёт разные тела документу и переходу внутри приложения — это
# видно по заголовку Vary самого ответа. Ключ обязан включать ровно те же
# заголовки, иначе переходу достанется целый документ, а документу — кусок
# разметки, и страница окажется пустой.
proxy_cache m_ranked_pages;
proxy_cache_key "$scheme$request_method$host$request_uri|$http_rsc|$http_next_router_state_tree|$http_next_router_prefetch|$http_next_router_segment_prefetch";

# Кэшируется только то, что безопасно повторить. Ответ с Set-Cookie nginx не
# кэширует сам — этот запрет намеренно не снимается.
proxy_cache_methods GET HEAD;
proxy_cache_valid 200 5s;
proxy_cache_valid 404 1s;
proxy_ignore_headers Cache-Control Expires;

# Пересчёт делает один запрос, остальные в это время получают прежний ответ.
# Без этого десять одновременных читателей запустили бы десять отрисовок.
proxy_cache_lock on;
proxy_cache_lock_timeout 5s;
proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
proxy_cache_background_update on;

# Чтобы можно было убедиться, что кэш работает, и обойти его при проверке.
proxy_cache_bypass $arg_nocache;
proxy_no_cache $arg_nocache;
add_header X-Cache-Status $upstream_cache_status always;
