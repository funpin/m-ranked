# Кэш готовых страниц. Включается внутри location публичного слоя; зона
# m_ranked_pages и переменные объявлены в traffic.conf.
#
# Один адрес отдаёт разные тела документу и переходу внутри приложения — это
# видно по заголовку Vary самого ответа. Ключ обязан включать ровно те же
# заголовки, иначе переходу достанется целый документ, а документу — кусок
# разметки. Сборка и признак gzip — там же: см. traffic.conf.
proxy_cache m_ranked_pages;
proxy_cache_key "$m_ranked_build|$request_method|$host$m_ranked_cache_uri|$m_ranked_gzip|$http_rsc|$http_next_router_state_tree|$http_next_router_prefetch|$http_next_router_segment_prefetch";
proxy_set_header Accept-Encoding $m_ranked_gzip;

# Кэшируется только то, что безопасно повторить. Ответ с Set-Cookie nginx не
# кэширует сам — этот запрет намеренно не снимается.
proxy_cache_methods GET HEAD;
# Срок задаёт приложение (X-Accel-Expires по возрасту поста); без него —
# микрокэш от повторов в ближайшие секунды.
proxy_cache_valid 200 5s;
proxy_cache_valid 404 1s;
proxy_ignore_headers Cache-Control Expires;

# Пересчёт делает один запрос, остальные в это время получают прежний ответ.
# Устаревшая копия отдаётся и тогда, когда шлюз отказал (503: пул занят).
proxy_cache_lock on;
proxy_cache_lock_timeout 10s;
proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
proxy_cache_background_update on;

# Обход кэша для проверки — только с самого сервера: снаружи ?nocache=1
# превращал бы любую страницу в промах.
proxy_cache_bypass $m_ranked_cache_bypass;
proxy_no_cache $m_ranked_cache_bypass;
add_header X-Cache-Status $upstream_cache_status always;
# add_header на уровне location отменяет наследование серверных заголовков.
include /etc/m-ranked/nginx/security-headers.conf;
