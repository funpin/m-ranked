# Accepted target public pages. Legacy remains the explicit fallback and owns
# /manage, /health, /emoji, /export and every public detail page until their
# separate compatibility gates pass.
location = /api/v1/admin {
    return 404;
}

location ^~ /api/v1/admin/ {
    return 404;
}

location = /api/v1/overview {
    limit_req zone=m_ranked_api burst=20 nodelay;
    proxy_pass http://m_ranked_target_api;
    include /etc/m-ranked/nginx/proxy-common.conf;
}

location = /api/v1/rating {
    limit_req zone=m_ranked_api burst=20 nodelay;
    proxy_pass http://m_ranked_target_api;
    include /etc/m-ranked/nginx/proxy-common.conf;
}

location = /api/v1/compare {
    limit_req zone=m_ranked_api burst=20 nodelay;
    proxy_pass http://m_ranked_target_api;
    include /etc/m-ranked/nginx/proxy-common.conf;
}

location ~ ^/api/v1/(institutions|accounts|publications)/[0-9]+/?$ {
    limit_req zone=m_ranked_api burst=20 nodelay;
    proxy_pass http://m_ranked_target_api;
    include /etc/m-ranked/nginx/proxy-common.conf;
}

location ^~ /_next/static/ {
    alias /opt/m-ranked/current/frontend/.next/static/;
    access_log off;
    log_not_found off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/m-ranked/nginx/security-headers.conf;
}

location ^~ /_next/ {
    proxy_pass http://m_ranked_target_web;
    include /etc/m-ranked/nginx/proxy-common.conf;
}

location = / {
    limit_except GET HEAD { deny all; }
    proxy_pass http://m_ranked_target_web;
    include /etc/m-ranked/nginx/proxy-common.conf;
}

location = /rating {
    limit_except GET HEAD { deny all; }
    proxy_pass http://m_ranked_target_web;
    include /etc/m-ranked/nginx/proxy-common.conf;
}

location = /compare {
    limit_except GET HEAD { deny all; }
    proxy_pass http://m_ranked_target_web;
    include /etc/m-ranked/nginx/proxy-common.conf;
}

location / {
    proxy_pass http://m_ranked_legacy;
    include /etc/m-ranked/nginx/proxy-common.conf;
}
