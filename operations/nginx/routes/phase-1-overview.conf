# Only the target overview API/page is public. Every unlisted API and page stays
# on legacy until its own parity evidence is accepted.
location = /api/v1/admin {
    return 404;
}

location ^~ /api/v1/admin/ {
    return 404;
}

location = /api/v1/overview {
    limit_req zone=m_ranked_api burst=20 nodelay;
    proxy_pass http://m_ranked_target_api;
    include /etc/m-ranked/nginx/proxy-common.conf;
}

location ^~ /_next/static/ {
    alias /opt/m-ranked/current/frontend/.next/static/;
    access_log off;
    log_not_found off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/m-ranked/nginx/security-headers.conf;
}

location ^~ /_next/ {
    proxy_pass http://m_ranked_target_web;
    include /etc/m-ranked/nginx/proxy-common.conf;
}

location = / {
    limit_except GET HEAD { deny all; }
    proxy_pass http://m_ranked_target_web;
    include /etc/m-ranked/nginx/proxy-common.conf;
}

location / {
    proxy_pass http://m_ranked_legacy;
    include /etc/m-ranked/nginx/proxy-common.conf;
}
