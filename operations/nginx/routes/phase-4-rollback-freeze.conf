# Rollback drain fence: keep every public read on legacy while all HTTP
# mutations remain closed. Only a verified, stopped reverse sync reopens them.
location = /api/v1/admin {
    return 404;
}

location ^~ /api/v1/admin/ {
    return 404;
}

location / {
    limit_except GET HEAD { deny all; }
    proxy_pass http://m_ranked_legacy;
    include /etc/m-ranked/nginx/proxy-common.conf;
}
