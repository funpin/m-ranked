name: mranked-target

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: mranked
      POSTGRES_USER: mranked_bootstrap
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_INITDB_ARGS: --data-checksums --auth-host=scram-sha-256
      PGDATA: /var/lib/postgresql/18/docker
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?set MIGRATION_DB_PASSWORD}
      API_READ_DB_PASSWORD: ${API_READ_DB_PASSWORD:?set API_READ_DB_PASSWORD}
      API_WRITE_ADMIN_DB_PASSWORD: ${API_WRITE_ADMIN_DB_PASSWORD:?set API_WRITE_ADMIN_DB_PASSWORD}
      COLLECTOR_INGEST_DB_PASSWORD: ${COLLECTOR_INGEST_DB_PASSWORD:?set COLLECTOR_INGEST_DB_PASSWORD}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD:?set BACKUP_DB_PASSWORD}
      MIGRATION_BRIDGE_DB_PASSWORD: ${MIGRATION_BRIDGE_DB_PASSWORD:?set MIGRATION_BRIDGE_DB_PASSWORD}
      MAINTENANCE_DB_PASSWORD: ${MAINTENANCE_DB_PASSWORD:?set MAINTENANCE_DB_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
          && psql --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
          --no-psqlrc --tuples-only --command 'SELECT 1' >/dev/null
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    stop_grace_period: 60s
    shm_size: 256mb
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:8.10.0
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command:
      - /bin/sh
      - -ec
      - >-
        exec redis-server
        --appendonly yes
        --appendfsync everysec
        --save 900 1
        --save 300 10
        --requirepass "$${REDIS_PASSWORD}"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - test "$$(REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli --no-auth-warning ping)" = PONG
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  redis_data:
