name: mranked-target

services:
  postgres:
    image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    restart: unless-stopped
    environment:
      POSTGRES_DB: mranked
      POSTGRES_USER: mranked_bootstrap
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_INITDB_ARGS: --data-checksums --auth-host=scram-sha-256
      PGDATA: /var/lib/postgresql/18/docker
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?set MIGRATION_DB_PASSWORD}
      API_READ_DB_PASSWORD: ${API_READ_DB_PASSWORD:?set API_READ_DB_PASSWORD}
      API_WRITE_ADMIN_DB_PASSWORD: ${API_WRITE_ADMIN_DB_PASSWORD:?set API_WRITE_ADMIN_DB_PASSWORD}
      COLLECTOR_INGEST_DB_PASSWORD: ${COLLECTOR_INGEST_DB_PASSWORD:?set COLLECTOR_INGEST_DB_PASSWORD}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD:?set BACKUP_DB_PASSWORD}
      MAINTENANCE_DB_PASSWORD: ${MAINTENANCE_DB_PASSWORD:?set MAINTENANCE_DB_PASSWORD}
      ANALYTICS_WORKER_DB_PASSWORD: ${ANALYTICS_WORKER_DB_PASSWORD:?set ANALYTICS_WORKER_DB_PASSWORD}
      OUTBOX_WORKER_DB_PASSWORD: ${OUTBOX_WORKER_DB_PASSWORD:?set OUTBOX_WORKER_DB_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init/001-create-roles.sh:/docker-entrypoint-initdb.d/001-create-roles.sh:ro
      - ./postgres/init/002-apply-schema.sh:/docker-entrypoint-initdb.d/002-apply-schema.sh:ro
      - ../db/migrations:/m-ranked-schema:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
          && psql --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
          --no-psqlrc --tuples-only --command 'SELECT 1' >/dev/null
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    stop_grace_period: 60s
    shm_size: 256mb
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
