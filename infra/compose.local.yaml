# Local Python/FastAPI stand. Run alongside compose.yaml with --env-file local/compose.env.
services:
  postgres:
    environment:
      POSTGRES_DB: ${LOCAL_DATABASE_NAME:-mranked}

  api:
    mem_limit: 768m
    security_opt:
      - no-new-privileges:true
    build:
      context: ..
      dockerfile: infra/local/api.Dockerfile
    restart: unless-stopped
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      API_READ_DB_HOST: postgres
      API_READ_DB_NAME: ${LOCAL_DATABASE_NAME:-mranked}
      API_READ_DB_USER: api_read
      API_READ_DB_PASSWORD: ${API_READ_DB_PASSWORD}
      API_WRITE_ADMIN_DB_HOST: postgres
      API_WRITE_ADMIN_DB_NAME: ${LOCAL_DATABASE_NAME:-mranked}
      API_WRITE_ADMIN_DB_USER: api_write_admin
      API_WRITE_ADMIN_DB_PASSWORD: ${API_WRITE_ADMIN_DB_PASSWORD}
      OUTBOX_WORKER_DB_HOST: postgres
      OUTBOX_WORKER_DB_NAME: ${LOCAL_DATABASE_NAME:-mranked}
      OUTBOX_WORKER_DB_USER: outbox_worker
      OUTBOX_WORKER_DB_PASSWORD: ${OUTBOX_WORKER_DB_PASSWORD}
      ADMIN_AUTH_USERS: >-
        [{"username":"admin","passwordHash":"$$2a$$10$$3P6XJBtkor5EEWC7uK9i4.xQC3ZLjEnCGjdhxOeUCkf860gh9fZja","roles":["ADMIN"]}]
      ADMIN_CSRF_SECRET: local-demo-csrf-secret-change-in-production
      # Этот секрет из примера приложение принимает только с явного
      # разрешения — в продуктовой конфигурации его нет.
      ADMIN_ALLOW_DEMO_SECRETS: "true"
      # Локальный стенд входит одним демонстрационным паролем. На проде второй
      # фактор обязателен: у каждой записи ADMIN_AUTH_USERS есть totpSecret, а
      # эта переменная не задаётся вовсе.
      ADMIN_REQUIRE_MFA: "false"
      MRANKED_IDENTITY_RECEIPT_DIR: /state/identity-receipts
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - api_state:/state
    depends_on:
      postgres:
        condition: service_healthy

  web:
    security_opt:
      - no-new-privileges:true
    build:
      context: ..
      dockerfile: infra/local/web.Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m
    environment:
      API_BASE_URL: http://api:8080
      NEXT_PUBLIC_DATA_CACHE: disabled
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - web_cache:/app/frontend/.next/cache
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  api_state:
  web_cache:
