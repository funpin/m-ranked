server {
    listen 3000;
    server_name localhost;
    resolver 127.0.0.11 valid=5s ipv6=off;
    client_max_body_size 2m;
    location = /__local/waiting {
        internal;
        alias /usr/share/nginx/html/waiting.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header X-Local-Warming "1" always;
    }
    location / {
        set $web_origin http://mranked-local-web-1:3000;
        proxy_pass $web_origin;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_intercept_errors on;
        error_page 502 504 =200 /__local/waiting;
    }
}
